<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 仅允许本页面的音乐播放器脚本，阻止托管平台注入的推广浮层。修改脚本后须重算 SHA-256。 -->
<meta http-equiv="Content-Security-Policy" content="script-src 'sha256-z0hVt0eGSUuQ4Kc+1e2mEiAhJKWSbcfAOB+HBO8q+fU='; object-src 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12">
<title>音乐雷达 · 中文音乐</title>
<style>
:root{
  --bg:#090b12; --bg2:#0f1320; --card:#151a29; --line:#232a3d;
  --txt:#e8ecf6; --dim:#8b96ad; --acc:#5b8cff; --acc2:#38d9a9; --warn:#ffb454;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
body{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);
  background:rgba(9,11,18,.86);border-bottom:1px solid var(--line);padding:14px 16px 10px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(135deg,#5b8cff,#38d9a9);display:grid;place-items:center;font-size:16px}
h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.02em}
.sub{font-size:11px;color:var(--dim);margin-top:1px}
.search{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);
  color:var(--txt);border-radius:11px;padding:11px 13px;font-size:15px;outline:none}
input[type=search]:focus{border-color:var(--acc)}
button{font-family:inherit;cursor:pointer}
.go{background:linear-gradient(135deg,#5b8cff,#4a6fe0);color:#fff;border:0;
  border-radius:11px;padding:0 16px;font-size:14px;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:11px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--card);border:1px solid var(--line);color:var(--dim);
  border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap;transition:.15s}
.tab.on{background:rgba(91,140,255,.16);border-color:rgba(91,140,255,.55);color:#cfe0ff;font-weight:600}
main{padding:12px 12px 4px}
.hint{font-size:12px;color:var(--dim);padding:6px 4px 12px;line-height:1.6}
.row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:13px;
  background:var(--card);border:1px solid transparent;margin-bottom:8px;transition:.15s}
.row:active{background:#1b2133}
.row.playing{border-color:rgba(91,140,255,.6);background:rgba(91,140,255,.1)}
.rank{width:24px;flex:none;text-align:center;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.rank.top{color:var(--warn);font-weight:700}
.cover{width:46px;height:46px;border-radius:9px;flex:none;object-fit:cover;background:#1d2334}
.meta{flex:1;min-width:0}
.title{font-size:14.5px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.acts{display:flex;gap:6px;flex:none}
.icon{width:36px;height:36px;border-radius:10px;background:#1e2537;border:1px solid var(--line);
  color:#c3cce0;display:grid;place-items:center;font-size:15px;text-decoration:none}
.icon:active{background:#28304a}
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(13,16,26,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.pl-top{display:flex;align-items:center;gap:11px}
.pl-cover{width:42px;height:42px;border-radius:9px;object-fit:cover;background:#1d2334;flex:none}
.pl-meta{flex:1;min-width:0}
.pl-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-artist{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.play{width:44px;height:44px;border-radius:50%;border:0;flex:none;
  background:linear-gradient(135deg,#5b8cff,#38d9a9);color:#08111c;font-size:17px;font-weight:700}
.bar{height:3px;background:#242b3f;border-radius:2px;margin:9px 0 3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5b8cff,#38d9a9);transition:width .25s linear}
.times{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:48px 20px;line-height:1.8}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:60;
  background:rgba(30,37,55,.97);border:1px solid var(--line);color:var(--txt);
  padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
footer{text-align:center;font-size:11px;color:#5c6579;padding:18px 20px 8px;line-height:1.8}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🎵</div>
    <div>
      <h1>音乐雷达</h1>
      <div class="sub">网易云 / QQ 音乐 / 酷狗 · 无损直连</div>
    </div>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="搜索歌曲、歌手" autocomplete="off" enterkeyhint="search">
    <button class="go" id="go">搜索</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div class="hint" id="hint">正在加载榜单…</div>
  <div id="list"></div>
  <footer>
    数据来自公开解析接口，仅供个人试听学习 · 请支持正版<br>
    音频与封面直连第三方 CDN，本页面不存储任何文件
  </footer>
</main>

<div class="player">
  <div class="pl-top">
    <img class="pl-cover" id="plCover" alt="">
    <div class="pl-meta">
      <div class="pl-title" id="plTitle">未在播放</div>
      <div class="pl-artist" id="plArtist">选择一首歌开始</div>
    </div>
    <button class="play" id="play">▶</button>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
</div>

<div class="toast" id="toast"></div>
<audio id="audio" preload="none" crossorigin="anonymous"></audio>

<script>
const HOSTS = ['https://api.qijieya.cn/meting/', 'https://api.injahow.cn/meting/'];
const CHARTS = [
  {id:'3778678', name:'热歌榜'},
  {id:'3779629', name:'新歌榜'},
  {id:'19723756', name:'飙升榜'},
  {id:'2884035', name:'原创榜'},
];
const SRCS = [
  {key:'netease', label:'网易云'},
  {key:'tencent', label:'QQ音乐'},
  {key:'kugou', label:'酷狗'},
];
const CHART_TTL = 10 * 60 * 1000;

const $ = s => document.querySelector(s);
const el = id => document.getElementById(id);
const audio = el('audio');
let list = [], cur = -1, curServer = 'netease', srcPick = 'netease', activeTab = CHARTS[0].id;

function toast(msg){
  const t = el('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 1900);
}
function fmt(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return m + ':' + String(s).padStart(2,'0');
}

// 多镜像 + 超时
async function api(params, timeout = 12000){
  let lastErr;
  for (const host of HOSTS){
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), timeout);
    try{
      const r = await fetch(host + '?' + params, {signal: ctl.signal, cache:'no-store'});
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      if (!Array.isArray(data) || !data.length) throw new Error('empty');
      return {data, host};
    }catch(e){ lastErr = e; clearTimeout(timer); }
  }
  throw lastErr || new Error('network');
}

function paintTabs(){
  const t = el('tabs');
  t.innerHTML = CHARTS.map(c=>`<button class="tab ${c.id===activeTab?'on':''}" data-id="${c.id}">${c.name}</button>`).join('');
  t.querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=>{ activeTab = b.dataset.id; paintTabs(); loadChart(); };
  });
}

function card(item, i, prefix){
  const rank = prefix ? i + 1 : '';
  const cover = item.pic || '';
  return `<div class="row" data-i="${i}">
    ${rank ? `<div class="rank ${i<3?'top':''}">${rank}</div>` : ''}
    <img class="cover" loading="lazy" src="${cover}" alt="">
    <div class="meta">
      <div class="title">${esc(item.name||'未知曲目')}</div>
      <div class="artist">${esc(item.artist||'未知歌手')}</div>
    </div>
    <div class="acts">
      <button class="icon download" type="button" title="按歌名和歌手下载">⬇</button>
    </div>
  </div>`;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(items, prefix){
  list = items;
  const box = el('list');
  if (!items.length){ box.innerHTML = '<div class="empty">没有结果</div>'; return; }
  box.innerHTML = items.map((it,i)=>card(it,i,prefix)).join('');
  box.querySelectorAll('.row').forEach(row=>{
    row.onclick = e=>{
      if (e.target.closest('.download')) {
        e.stopPropagation();
        downloadSong(items[Number(row.dataset.i)], e.target.closest('.download'));
        return;
      }
      play(Number(row.dataset.i));
    };
  });
  if (cur >= 0) markPlaying();
}

function audioFormat(bytes){
  const s = String.fromCharCode(...bytes.slice(0,12));
  if (s.startsWith('fLaC')) return ['flac','audio/flac'];
  if (s.startsWith('OggS')) return ['ogg','audio/ogg'];
  if (s.startsWith('RIFF') && s.slice(8,12)==='WAVE') return ['wav','audio/wav'];
  if (s.startsWith('ID3') || (bytes[0]===255 && (bytes[1]&224)===224)) return ['mp3','audio/mpeg'];
  if (s.slice(4,8)==='ftyp') return ['m4a','audio/mp4'];
  if (bytes[0]===26 && bytes[1]===69 && bytes[2]===223 && bytes[3]===163) return ['webm','audio/webm'];
  throw new Error('服务器没有返回可识别的音频');
}
function songFilename(item, ext){
  const clean = s => String(s).replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').trim().slice(0,90);
  return clean(item.name||'未知曲目') + ' - ' + clean(item.artist||'未知歌手') + '.' + ext;
}
async function downloadSong(item, button){
  if (!item || button.disabled) return;
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(),180000);
  button.disabled = true; button.textContent = '…';
  toast('正在准备音频，完成后按歌名保存');
  try {
    const r = await fetch(item.url,{signal:ctl.signal});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.arrayBuffer();
    const [ext,mime] = audioFormat(new Uint8Array(data));
    const filename = songFilename(item,ext);
    const url = URL.createObjectURL(new Blob([data],{type:mime}));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),120000);
    toast('已准备下载：'+filename);
  } catch(e) {
    toast('下载失败：'+(e.name==='AbortError'?'请求超时，请重试':e.message));
  } finally {
    clearTimeout(timer); button.disabled = false; button.textContent = '⬇';
  }
}

function markPlaying(){
  el('list').querySelectorAll('.row').forEach(r=>{
    r.classList.toggle('playing', Number(r.dataset.i) === cur);
  });
}

async function loadChart(){
  const chart = CHARTS.find(c=>c.id===activeTab);
  el('hint').textContent = '正在加载「' + chart.name + '」…';
  el('list').innerHTML = '';
  const key = 'mr.chart.' + activeTab;
  try{
    const raw = localStorage.getItem(key);
    if (raw){
      const o = JSON.parse(raw);
      if (o.t && Date.now() - o.t < CHART_TTL && o.d?.length){
        el('hint').textContent = `网易云 · ${chart.name} · ${o.d.length} 首 · ${new Date(o.t).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})} 更新`;
        render(o.d, true); return;
      }
    }
  }catch(e){}
  try{
    const {data} = await api(`server=netease&type=playlist&id=${activeTab}`);
    const items = data.slice(0, 100);
    el('hint').textContent = `网易云 · ${chart.name} · ${items.length} 首 · 刚刚更新`;
    render(items, true);
    try{ localStorage.setItem(key, JSON.stringify({t:Date.now(), d:items})); }catch(e){}
  }catch(e){
    el('hint').textContent = '榜单加载失败：' + (e.message||'网络问题') + '，可下拉重试或直接搜索';
  }
}

async function doSearch(){
  const kw = el('q').value.trim();
  if (!kw){ loadChart(); return; }
  el('hint').textContent = '正在搜索「' + kw + '」…';
  el('list').innerHTML = '';
  const src = SRCS.find(s=>s.key===srcPick) || SRCS[0];
  try{
    const {data} = await api(`server=${src.key}&type=search&id=${encodeURIComponent(kw)}&limit=40`);
    curServer = src.key;
    el('hint').textContent = `${src.label} · 「${kw}」· ${data.length} 条结果`;
    render(data, false);
  }catch(e){
    curServer = 'netease';
    el('hint').textContent = '搜索失败：' + (e.message||'网络问题');
  }
}

function play(i){
  const it = list[i];
  if (!it) return;
  cur = i;
  el('plTitle').textContent = it.name || '未知曲目';
  el('plArtist').textContent = it.artist || '';
  el('plCover').src = it.pic || '';
  audio.src = it.url;
  audio.play().catch(()=>toast('浏览器拦截了自动播放，请再点一次播放'));
  markPlaying();
}

el('play').onclick = ()=>{
  if (!audio.src) return toast('先选一首歌');
  if (audio.paused) audio.play().catch(()=>toast('播放失败，换一首试试'));
  else audio.pause();
};
el('go').onclick = doSearch;
el('q').addEventListener('keydown', e=>{ if (e.key === 'Enter'){ e.preventDefault(); el('q').blur(); doSearch(); }});
el('q').addEventListener('search', doSearch);

audio.addEventListener('play', ()=>el('play').textContent = '❚❚');
audio.addEventListener('pause', ()=>el('play').textContent = '▶');
audio.addEventListener('timeupdate', ()=>{
  const d = audio.duration || 0;
  el('prog').style.width = d ? (audio.currentTime/d*100).toFixed(2) + '%' : '0';
  el('cur').textContent = fmt(audio.currentTime);
  el('dur').textContent = fmt(d);
});
audio.addEventListener('ended', ()=>{
  if (cur >= 0 && cur + 1 < list.length) play(cur + 1);
});
audio.addEventListener('error', ()=>toast('这首歌暂时无法播放（可能版权受限）'));

// 音源选择：搜索用哪个平台
const srcBar = document.createElement('div');
srcBar.className = 'tabs';
srcBar.style.marginTop = '8px';
srcBar.innerHTML = SRCS.map(s=>`<button class="tab ${s.key===srcPick?'on':''}" data-k="${s.key}">搜 ${s.label}</button>`).join('');
srcBar.querySelectorAll('.tab').forEach(b=>{
  b.onclick = ()=>{ srcPick = b.dataset.k;
    srcBar.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.k===srcPick));
    if (el('q').value.trim()) doSearch(); };
});
$('header').appendChild(srcBar);

paintTabs();
loadChart();

// 自测：?selftest=1 时自动加载第一首的元数据，验证音频链路（不自动播放）
if (location.search.includes('selftest=1')){
  setTimeout(async ()=>{
    if (!list.length) return;
    const it = list[0];
    audio.src = it.url;
    audio.load();
    const ok = await new Promise(res=>{
      const t = setTimeout(()=>res('timeout'), 15000);
      audio.addEventListener('loadedmetadata', ()=>{clearTimeout(t); res('ok');}, {once:true});
      audio.addEventListener('error', ()=>{clearTimeout(t); res('error');}, {once:true});
    });
    el('hint').textContent = 'SELFTEST ' + ok + ' · duration=' + (isFinite(audio.duration)?audio.duration.toFixed(1):audio.duration)
      + ' · src=' + (it.url||'').slice(0,60);
  }, 3000);
}

</script>
</body>
</html>
