<script>
const HOSTS = ['https://api.qijieya.cn/meting/', 'https://api.injahow.cn/meting/'];
const CHARTS = [
  {id:'3778678', name:'热歌榜'},
  {id:'3779629', name:'新歌榜'},
  {id:'19723756', name:'飙升榜'},
  {id:'2884035', name:'原创榜'},
];
const SRCS = [
  {key:'netease', label:'网易云'},
  {key:'tencent', label:'QQ音乐'},
  {key:'kugou', label:'酷狗'},
];
const CHART_TTL = 10 * 60 * 1000;

const $ = s => document.querySelector(s);
const el = id => document.getElementById(id);
const audio = el('audio');
let list = [], cur = -1, curServer = 'netease', srcPick = 'netease', activeTab = CHARTS[0].id;

function toast(msg){
  const t = el('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 1900);
}
function fmt(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return m + ':' + String(s).padStart(2,'0');
}

// 多镜像 + 超时
async function api(params, timeout = 12000, options = {}){
  let lastErr;
  for (const host of options.host ? [options.host] : HOSTS){
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), timeout);
    try{
      const r = await fetch(host + '?' + params, {signal: ctl.signal, cache:'no-store'});
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      if (!Array.isArray(data)) throw new Error('接口返回格式错误');
      if (!data.length && !options.allowEmpty) throw new Error('empty');
      return {data, host};
    }catch(e){ lastErr = e; clearTimeout(timer); }
  }
  throw lastErr || new Error('network');
}

let playlistView=false, viewRequest=0;
let searchState=null;
function resetSearch(){
  searchState=null;
  el('searchPagerTop').hidden=true;
  el('searchPager').hidden=true;
}
function paintSearchPager(state){
  if(searchState!==state||state.request!==viewRequest)return;
  el('searchPagerTop').hidden=state.done;
  el('searchPager').hidden=false;
  for(const id of ['searchMoreTop','searchMore']){
    const button=el(id);
    button.hidden=state.done;
    button.disabled=state.loading;
    button.textContent=state.loading?'正在加载…':state.error?'重试加载更多':'加载更多歌曲';
  }
  el('searchPageStatus').textContent=state.error||

function parsePlaylist(input,source){
  input=input.trim();
  if(/^\d+$/.test(input)) return {server:source,id:input};
  const found=input.match(/https?:\/\/[^\s<>"'，。]+/i);
  if(!found) throw new Error('请粘贴完整歌单链接或数字 ID');
  const u=new URL(found[0]); let server,id;
  if(/(^|\.)music\.163\.com$/.test(u.hostname)||u.hostname==='163cn.tv'){
    server='netease'; id=u.searchParams.get('id')||(u.hash.match(/[?&]id=(\d+)/)||[])[1]||(u.pathname.match(/\/playlist\/(\d+)/)||[])[1];
  } else if(/(^|\.)y\.qq\.com$/.test(u.hostname)){
    server='tencent'; id=u.searchParams.get('id')||u.searchParams.get('disstid')||(u.pathname.match(/\/(?:playlist|taoge)\/(\d+)/)||[])[1];
  } else throw new Error('仅支持网易云或 QQ 音乐歌单链接');
  if(!/^\d+$/.test(id||'')) throw new Error('该分享短链没有歌单 ID，请在原平台打开后复制完整歌单链接，或输入歌单数字 ID');
  return {server,id};
}

async function readFullPlaylist(ref,onProgress,isCurrent){
  if(location.protocol==='file:')throw new Error('请通过本机服务打开 http://127.0.0.1:18766/ ，文件预览无法调用完整歌单接口');
  const items=[],seen=new Set();let offset=0,total=null,title=ref.id;
  while(isCurrent()){
    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),45000);
    let page;
    try{
      const r=await fetch('/.netlify/functions/playlist?'+new URLSearchParams({server:ref.server,id:ref.id,offset:String(offset)}),{signal:ctl.signal,cache:'no-store'});
      if(r.status===404)throw new Error('完整歌单服务尚未部署，需同时部署 Netlify Functions；单独上传 HTML 无法启用');
      if(!(r.headers.get('content-type')||'').includes('application/json'))throw new Error('完整歌单服务未启用，请部署包含 Functions 的站点');
      page=await r.json();if(!r.ok)throw new Error(page.error||'读取歌单失败');
    }finally{clearTimeout(timer);}
    if(!isCurrent())return null;
    if(!Number.isSafeInteger(page.total)||page.total<0||!Array.isArray(page.items)||!Number.isSafeInteger(page.nextOffset))throw new Error('歌单服务返回无效分页数据');
    if(total!==null&&total!==page.total)throw new Error('歌单在导入期间发生变化，请重新导入');
    total=page.total;title=page.title||title;
    // Keep every playlist position, including duplicate tracks. Detect a backend that ignores offset.
    const signature=JSON.stringify(page.items.map(it=>it.id||it.url));
    if(page.items.length&&seen.has(signature))throw new Error('平台重复返回同一页，已保留 '+items.length+'/'+total+' 首，请稍后重试');
    seen.add(signature);
    if(page.nextOffset!==offset+page.items.length||page.nextOffset>total)throw new Error('分页位置与曲目数量不一致');
    items.push(...page.items);onProgress(items,total,title);
    if(page.complete){if(items.length!==total)throw new Error('平台未返回完整歌单');return {items,total,title};}
    if(page.nextOffset<=offset)throw new Error('平台未返回后续曲目，已读取 '+items.length+'/'+total+' 首');
    offset=page.nextOffset;
  }
  return null;
}

}

function audioFormat(bytes){
  const s = String.fromCharCode(...bytes.slice(0,12));
  if (s.startsWith('fLaC')) return ['flac','audio/flac'];
  if (s.startsWith('OggS')) return ['ogg','audio/ogg'];
  if (s.startsWith('RIFF') && s.slice(8,12)==='WAVE') return ['wav','audio/wav'];
  if (s.startsWith('ID3') || (bytes[0]===255 && (bytes[1]&224)===224)) return ['mp3','audio/mpeg'];
  if (s.slice(4,8)==='ftyp') return ['m4a','audio/mp4'];
  if (bytes[0]===26 && bytes[1]===69 && bytes[2]===223 && bytes[3]===163) return ['webm','audio/webm'];
  throw new Error('服务器没有返回可识别的音频');
}
function songFilename(item, ext){
  const clean = s => String(s).replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').trim().slice(0,90);
  return clean(item.name||'未知曲目') + ' - ' + clean(item.artist||'未知歌手') + '.' + ext;
}
let pendingDl = null;

function downloadSong(item, button){

  el('shTitle').textContent = (item.name || '未知曲目') + ' · 选择音质';
  el('sheet').classList.add('on');

// 按音质改写接口地址：无损加 br=999000，标准去掉 br
function withQuality(url, quality){
  try{
    const u = new URL(url, location.href);
    if (quality === 'flac') u.searchParams.set('br','999000');
    else u.searchParams.delete('br');
    return u.toString();
  }catch(e){
    if (quality !== 'flac') return url;
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'br=999000';
  }
}
async function doDownload(item, button, quality, signal){
  if (!item) return {ok:false};
  const ctl = new AbortController();
  const cancel=()=>ctl.abort();
  if(signal){signal.addEventListener('abort',cancel,{once:true});if(signal.aborted)ctl.abort();}
  const timer = setTimeout(()=>ctl.abort(),300000);
  const oldLabel = button ? button.textContent : '⬇';
  if (button){ button.disabled = true; button.textContent = '…'; }
  toast(quality === 'flac' ? '正在获取无损音频，文件较大请稍候…' : '正在准备音频，完成后按歌名保存');
  try {
    let downloadUrl=withQuality(item.url,quality);
    if(['netease','tencent','kugou'].includes(playbackPlatform(item))){const result=await resolvePlayback(item,ctl.signal);downloadUrl=result.url;}
    const r = await fetch(downloadUrl, {signal: ctl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.arrayBuffer();
    if (!data.byteLength) throw new Error('接口返回空文件，可能该曲暂无此音质');
    const [ext, mime] = audioFormat(new Uint8Array(data));
    const filename = songFilename(item, ext);
    const url = URL.createObjectURL(new Blob([data], {type: mime}));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 180000);
    const mb = (data.byteLength / 1048576).toFixed(1);
    if (quality === 'flac' && ext !== 'flac') toast('该曲暂无无损，已保存 ' + ext.toUpperCase() + '（' + mb + ' MB）');
    else toast('已下载：' + filename + '（' + mb + ' MB）');
    return {ok:true,fallback:quality==='flac'&&ext!=='flac'};
  } catch(e) {
    if(signal?.aborted)return {ok:false,cancelled:true};
    toast('下载失败：' + (e.name === 'AbortError' ? '请求超时，请重试' : e.message));
    return {ok:false};
  } finally {
    if(signal)signal.removeEventListener('abort',cancel);
    clearTimeout(timer);
    if (button){ button.disabled = false; button.textContent = oldLabel; }
  }
}
function confirmDownload(quality){

  if(!pending)return;
  if(pending.items)runBatch(pending.items,quality);else doDownload(pending.item,pending.button,quality);
}

async function loadChart(){
  const request=++viewRequest;resetSearch();leavePersonal();playlistView=false;el('batchTools').classList.remove('on');
  const chart = CHARTS.find(c=>c.id===activeTab);
  el('hint').textContent = '正在加载「' + chart.name + '」…';
  el('list').innerHTML = '';
  const key = 'mr.chart.' + activeTab;
  try{
    const raw = localStorage.getItem(key);
    if (raw){

function parseLrc(text){
  const offsetMatch = text.match(/\[offset:([+-]?\d+)\]/i);
  const offset = offsetMatch ? Number(offsetMatch[1])/1000 : 0;
  const lines = [];
  for (const raw of text.split(/\r?\n/)){
    const tags = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const body = raw.replace(/\[[^\]]*\]/g,'').trim();
    if (!body || !tags.length) continue;
    const wordTags = [...body.matchAll(/<(\d+):(\d+(?:\.\d+)?)>/g)];
    let words = [];
    let cursor = 0;
    let wordTime = null;
    for (const tag of wordTags){
      const before = body.slice(cursor,tag.index);
      if (before) words.push({time:wordTime,text:before});
      wordTime = Math.max(0,Number(tag[1])*60+Number(tag[2])+offset);
      cursor = tag.index+tag[0].length;
    }
    const tail = body.slice(cursor);
    if (tail) words.push({time:wordTime,text:tail});
    const cleanText = words.map(word=>word.text).join('').trim();
    if (!cleanText) continue;
    for (const tag of tags){
      const time = Math.max(0,Number(tag[1])*60+Number(tag[2])+offset);
      const lineWords = words.map(word=>({time:word.time===null?time:word.time,text:word.text}));
      lines.push({time,text:cleanText,words:lineWords,wordTimed:wordTags.length>0});
    }
  }
  return lines.sort((a,b)=>a.time-b.time);
}
async function loadLyrics(item){

function syncLyrics(force=false){
  const time=Number.isFinite(audio.currentTime)?audio.currentTime:0;
  let index = -1;
  for (let i=0;i<lyricLines.length && lyricLines[i].time<=time;i++) index=i;
  const changed = index!==lyricIndex;
  const rows = el('lyrics').children;
  if (changed){
    if (rows[lyricIndex]) rows[lyricIndex].classList.remove('active');
    if (rows[index]) rows[index].classList.add('active');
    lyricIndex=index;
  }
  if(index>=0){
    const line=lyricLines[index], next=lyricLines[index+1];
    const fallbackEnd=line.time+3.2;
    const lineEnd=next?Math.max(line.time+.12,next.time):Math.max(line.time+.12,Math.min(audio.duration||fallbackEnd,fallbackEnd));
    const lineProgress=Math.max(0,Math.min(1,(time-line.time)/Math.max(.12,lineEnd-line.time)));
    const words=rows[index]?.querySelectorAll('.lyric-word')||[];
    if(line.wordTimed){
      words.forEach((node,j)=>{
        const word=line.words[j], following=line.words[j+1];
        const start=word?.time??line.time;
        const end=following?.time??lineEnd;
        const progress=Math.max(0,Math.min(1,(time-start)/Math.max(.08,end-start)));
        node.style.setProperty('--word-progress',(progress*100).toFixed(1)+'%');
        node.classList.toggle('word-current',time>=start&&time<end);
      });
    }else if(words[0]){
      words[0].style.setProperty('--word-progress',(lineProgress*100).toFixed(1)+'%');
    }
    el('lyricDockText').textContent=line.text.length>30?line.text.slice(0,30)+'…':line.text;
    el('lyricStatus').textContent=line.wordTimed?'逐字同步':'跟随播放';
  }else if(lyricLines.length){
    el('lyricDockText').textContent='即将开始'; el('lyricStatus').textContent='等待歌词';
  }
  if ((changed || force) && index>=0 && Date.now()>lyricTouchUntil && el('nowPage').classList.contains('on') && el('nowPages').scrollLeft>el('nowPages').clientWidth/2){
    const row=rows[index];
    if(row){
      const target=row.offsetTop-el('lyrics').clientHeight*.43+row.clientHeight/2;
      const max=Math.max(0,el('lyrics').scrollHeight-el('lyrics').clientHeight);
      el('lyrics').scrollTo({top:Math.max(0,Math.min(max,target)),behavior:force?'auto':'smooth'});
    }
  }
}

async function probePlaybackUrl(url,signal){
  const ctl=new AbortController(),abort=()=>ctl.abort();
  signal.addEventListener('abort',abort,{once:true});if(signal.aborted)ctl.abort();
  const timer=setTimeout(abort,6500);let reader;
  try{
    const r=await fetch(url,{signal:ctl.signal,cache:'no-store',headers:{Range:'bytes=0-4095'}});
    if(!r.ok)throw Error('HTTP '+r.status);
    reader=r.body?.getReader();let chunks=[],length=0;
    if(reader){while(length<16384){const {value,done}=await reader.read();if(done)break;chunks.push(value.slice(0,16384-length));length+=chunks[chunks.length-1].length;
      if((r.headers.get('content-type')||'').startsWith('audio/')||length>=16384)break;}}
    else {const b=new Uint8Array(await r.arrayBuffer());chunks=[b.slice(0,16384)];length=chunks[0].length;}
    const bytes=new Uint8Array(length);let offset=0;for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.length;}
    if(!length)throw Error('音源返回空内容');
    try{audioFormat(bytes);return r.url||url;}catch{}
    if((r.headers.get('content-type')||'').startsWith('audio/'))return r.url||url;
    let data;try{data=JSON.parse(new TextDecoder().decode(bytes));}catch{throw Error('音源没有返回音频');}
    const candidate=typeof data==='string'?data:data?.url||data?.data?.url||data?.[0]?.url;
    const resolved=webUrl(candidate);
    if(!resolved||resolved===url)throw Error('音源没有提供播放地址');
    return resolved;
  }finally{clearTimeout(timer);signal.removeEventListener('abort',abort);if(reader)try{await reader.cancel();}catch{}}
}

  const data=await r.json();
  if(!r.ok)throw Error(data.error||'完整音频核验失败');
  if(!data.verifiedFull||!data.fullDecoded||!data.tailDecoded||!Number.isFinite(data.duration)||!/^\/media\/[a-f0-9]{36}$/.test(data.url))throw Error('音源未通过完整性核验');

el('lyrics').addEventListener('wheel',()=>{lyricTouchUntil=Date.now()+4000;},{passive:true});
document.addEventListener('keydown',event=>{if(event.key==='Escape') closeNow();});
for (const event of ['timeupdate','loadedmetadata','durationchange','play','pause','emptied','ended']) audio.addEventListener(event,syncNow);

function play(i,seconds=0){
  const it = list[i];
  if (!it) return;
  playingQueue = list.slice();
  startTrack(it,i,seconds);
  openNow();
}

el('play').onclick = ()=>{
  if(playbackLoading)return toast('正在检查播放地址，请稍候');
  if(playingItem&&playbackFailed)return startTrack(playingItem,playingIndex,audio.currentTime||0);
  if (!audio.src) return toast('先选一首歌');
  if (audio.paused)playAudio(playbackRequest);
  else audio.pause();
};
el('go').onclick = doSearch;
el('q').addEventListener('keydown', e=>{ if (e.key === 'Enter'){ e.preventDefault(); el('q').blur(); doSearch(); }});
el('q').addEventListener('search', doSearch);

audio.addEventListener('play', ()=>el('play').textContent = '❚❚');
audio.addEventListener('pause', ()=>el('play').textContent = '▶');
audio.addEventListener('timeupdate', ()=>{
  const d = audio.duration || 0;
  el('prog').style.width = d ? (audio.currentTime/d*100).toFixed(2) + '%' : '0';
  el('cur').textContent = fmt(audio.currentTime);
  el('dur').textContent = fmt(d);
});
audio.addEventListener('ended', ()=>{
  if(loopMode===2){ audio.currentTime=0; playAudio(playbackRequest); return; }
  if (playingIndex >= 0 && playingIndex + 1 < playingQueue.length) changeTrack(1);
  else if(loopMode===1 && playingQueue.length) startTrack(playingQueue[0],0);
});
audio.addEventListener('error', ()=>{
  if(!playingItem||!audio.getAttribute('src')||playbackLoading)return;
  playbackFailed=true;playbackNotice('音频地址无法加载或格式不受支持，可重试当前音源。',true);
});
audio.addEventListener('playing',()=>{playbackFailed=false;playbackNotice();});

// 音源选择：搜索用哪个平台
const srcBar = document.createElement('div');
srcBar.className = 'tabs';
srcBar.style.marginTop = '8px';
srcBar.innerHTML = SRCS.map(s=>`<button class="tab ${s.key===srcPick?'on':''}" data-k="${s.key}">搜 ${s.label}</button>`).join('');
srcBar.querySelectorAll('.tab').forEach(b=>{
  b.onclick = ()=>{ srcPick = b.dataset.k;
    srcBar.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.k===srcPick));
    if (el('q').value.trim()) doSearch(); else if(searchState)loadChart(); };
});
$('header').appendChild(srcBar);

let homeLastScroll=window.scrollY, homeScrollFrame=0, homeChromeHidden=false;
function setHomeChrome(hidden){
  const player=document.querySelector('.player');
  if (document.body.style.overflow==='hidden' || hidden===homeChromeHidden) return;
  homeChromeHidden=hidden;
  document.body.classList.toggle('home-chrome-hidden',hidden);
  player?.classList.toggle('is-bubble',hidden);
}
function updateHomeChrome(){
  homeScrollFrame=0;
  const y=window.scrollY, delta=y-homeLastScroll;
  if (y<=24) setHomeChrome(false);
  else if (delta>10 && y>56) setHomeChrome(true);
  else if (delta<-12) setHomeChrome(false);
  homeLastScroll=y;
}
window.addEventListener('scroll',()=>{if(!homeScrollFrame)homeScrollFrame=requestAnimationFrame(updateHomeChrome)},{passive:true});
document.querySelector('.player').addEventListener('click',event=>{
  const player=document.querySelector('.player');
  if (!player.classList.contains('is-bubble') || event.target.closest('#play')) return;
  openNow();
});
paintTabs();
const resumeAtStart=getResume();
if(resumeAtStart)showPersonal(resumeAtStart.playlist.id);else loadChart();

// 自测：?selftest=1 时自动加载第一首的元数据，验证音频链路（不自动播放）
if (location.search.includes('selftest=1')){
  setTimeout(async ()=>{
    if (!list.length) return;
    const it = list[0];
    audio.src = it.url;
    audio.load();
    const ok = await new Promise(res=>{
      const t = setTimeout(()=>res('timeout'), 15000);
      audio.addEventListener('loadedmetadata', ()=>{clearTimeout(t); res('ok');}, {once:true});
      audio.addEventListener('error', ()=>{clearTimeout(t); res('error');}, {once:true});
    });
    el('hint').textContent = 'SELFTEST ' + ok + ' · duration=' + (isFinite(audio.duration)?audio.duration.toFixed(1):audio.duration)
      + ' · src=' + (it.url||'').slice(0,60);
  }, 3000);
}

</script>
