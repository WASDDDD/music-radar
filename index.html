/* Load before the stylesheet to establish the first painted theme. */
(() => {
  'use strict';
  const root = document.documentElement;
  const storageKey = 'lg.theme';
  const modes = new Set(['auto', 'light', 'dark']);
  const media = window.matchMedia('(prefers-color-scheme: dark)');
  let mode = 'auto';
  let nativeDark = null;
  try {
    const saved = localStorage.getItem(storageKey);
    if (modes.has(saved)) mode = saved;
  } catch { /* Storage can be disabled. Keep the in-memory mode. */ }
  try {
    const reported = window.LiquidGlassHost?.getSystemDarkMode?.();
    if (reported === true || reported === false) nativeDark = reported;
    if (reported === 'dark' || reported === 'light') nativeDark = reported === 'dark';
  } catch { /* Some hosts expose the bridge only after navigation. */ }

  function apply() {
    const theme = mode === 'auto' ? ((nativeDark ?? media.matches) ? 'dark' : 'light') : mode;
    if (root.dataset.lgTheme === theme && root.dataset.lgMode === mode) return;
    root.dataset.lgTheme = theme;
    root.dataset.lgMode = mode;
    window.dispatchEvent(new CustomEvent('lg:theme', { detail: { mode, theme } }));
  }

  window.LiquidGlassTheme = Object.freeze({
    get mode() { return mode; },
    get theme() { return root.dataset.lgTheme; },
    setMode(value) {
      if (!modes.has(value)) return false;
      mode = value;
      try { localStorage.setItem(storageKey, value); } catch { /* Retain memory state. */ }
      apply();
      return true;
    },
    setSystemDark(value) {
      if (value !== null && typeof value !== 'boolean') return false;
      nativeDark = value;
      apply();
      return true;
    }
  });
  if (media.addEventListener) media.addEventListener('change', apply);
  else media.addListener(apply);
  apply();
})();

(() => {
  let skin = 'miuix';
  try {
    if (localStorage.getItem('musicRadar.appearance') === 'glass') skin = 'glass';
  } catch { /* Storage may be unavailable. */ }
  document.documentElement.dataset.radarSkin = skin;
  if (new URLSearchParams(location.search).get('glass-fallback') === '1') {
    document.documentElement.setAttribute('data-lg-no-svg', '');
  }
})();

/* Appearance switch. The live player stays mounted in either skin. */
.appearance-toggle {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  margin-inline-start: auto; min-height: 44px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--card); color: var(--txt); font-size: 12px;
  font-weight: 650; white-space: nowrap;
  transition: background-color .26s ease, color .26s ease, box-shadow .26s ease;
}
.appearance-icon { font-size: 16px; color: var(--acc); }
.appearance-toggle:focus-visible {
  outline: 2px solid var(--acc); outline-offset: 3px;
}
.now-head { display: grid; grid-template-columns: 1fr auto 1fr; padding-inline: clamp(8px, 3vw, 20px); }
.now-head #nowClose { justify-self: start; }
.now-actions { display: flex; justify-self: end; align-items: center; }
.now-head .now-actions button {
  width: auto; min-width: 44px; min-height: 44px; padding: 0 4px;
  font-size: 13px; color: #d7e3f3;
}
.now-actions .appearance-toggle { margin: 0; border: 0; background: #ffffff12; }
.now-actions .appearance-toggle[aria-pressed=true] { color: #9ff1da; background-color: #a5f3df26; }
:root[data-radar-skin="miuix"] { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root[data-radar-skin="miuix"] { color-scheme: dark; }
}

/* Liquid Glass surfaces. Limit live refraction to the stable search capsule. */
:root[data-radar-skin="glass"] {
  --lg-background: #e6eef7;
  --lg-ink: #14273c;
  --lg-muted: #475c73;
  --lg-accent: #145f85;
  --lg-aurora-a: #a5e2d5;
  --lg-aurora-b: #bdaeea;
  --bg: var(--lg-background); --bg2: var(--lg-solid); --card: var(--lg-solid);
  --txt: var(--lg-ink); --dim: var(--lg-muted); --acc: var(--lg-accent); --acc2: var(--lg-accent);
  --line: var(--lg-line); --pressed: #c9dcf0; --warn: #924d16;
  --glass-card: #f7fbffad; --glass-row: #f5faff54;
  --glass-active: #c0eee5c4; --glass-action: #e8f5fd;
  --glass-rim: #ffffffc9; --glass-edge: #35548121;
  --glass-shine: linear-gradient(165deg, #fff9, transparent 46%);
}
:root[data-radar-skin="glass"][data-lg-theme="dark"] {
  --lg-background: #111c2c;
  --lg-ink: #eff7ff;
  --lg-muted: #b4c4d9;
  --lg-accent: #a5eddd;
  --lg-aurora-a: #1b6b6b;
  --lg-aurora-b: #514387;
  --pressed: #2a4461; --warn: #ffc18e;
  --glass-card: #1a2a41c9; --glass-row: #27415a4d;
  --glass-active: #235961c4; --glass-action: #27445a;
  --glass-rim: #cde7ff4a; --glass-edge: #a5caff24;
  --glass-shine: linear-gradient(165deg, #a3daff25, transparent 48%);
}
[data-radar-skin="glass"] body {
  background: radial-gradient(ellipse at 8% 15%, var(--lg-aurora-a), transparent 60%),
              radial-gradient(ellipse at 95% 45%, var(--lg-aurora-b), transparent 62%), var(--bg);
  background-attachment: fixed;
}
[data-radar-skin="glass"] body > header {
  background: transparent; border-color: transparent; box-shadow: none;
  -webkit-backdrop-filter: none; backdrop-filter: none;
}
[data-radar-skin="glass"] body > header::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background-color: var(--lg-solid);
  border-radius: 0 0 28px 28px;
  box-shadow: inset 0 -1px var(--glass-rim), 0 10px 25px -18px var(--lg-shadow);
}
[data-radar-skin="glass"] .brand h1 { font-size: clamp(23px, 6vw, 34px); line-height: 1.16; letter-spacing: -.035em; }
[data-radar-skin="glass"] .brand .sub { color: var(--dim); }
[data-radar-skin="glass"] .brand .logo {
  width: 42px; height: 42px; border-radius: 15px; color: var(--txt);
  background: var(--glass-shine), var(--glass-card);
  box-shadow: inset 0 0 0 1px var(--glass-rim), 0 8px 21px -12px var(--lg-shadow);
}
[data-radar-skin="glass"] body > header .appearance-toggle {
  color: var(--txt); background-color: var(--lg-solid); border-color: var(--glass-rim);
  box-shadow: inset 0 1px 0 var(--glass-rim), 0 4px 16px -9px var(--lg-shadow);
}
[data-radar-skin="glass"] .search { padding: 4px; align-items: stretch; background-image: var(--glass-shine); }
[data-radar-skin="glass"] .search input[type=search] {
  border-radius: 999px; background: transparent; border-color: transparent; color: var(--txt); padding-left: 13px;
}
[data-radar-skin="glass"] .search input[type=search]::placeholder { color: var(--dim); }
[data-radar-skin="glass"] .search input[type=search]:focus-visible { border-color: var(--acc); }
[data-radar-skin="glass"] .go {
  border: 1px solid var(--glass-rim); border-radius: 999px;
  background: var(--glass-shine), var(--glass-action); color: var(--acc);
}
[data-radar-skin="glass"] .tabs { background: transparent; border: 0; }
[data-radar-skin="glass"] .tab {
  border-radius: 999px; background: var(--glass-row); border: 1px solid var(--glass-edge); color: var(--txt);
}
[data-radar-skin="glass"] .tab.on,
[data-radar-skin="glass"] .library button[aria-current=true] {
  background: var(--glass-active); color: var(--txt); border-color: var(--glass-rim);
  box-shadow: inset 0 1px var(--glass-rim);
}
[data-radar-skin="glass"] :is(.library,.playlist-tools,#list) {
  background: var(--glass-shine), var(--glass-card); border: 1px solid var(--glass-rim);
  border-radius: 24px; box-shadow: 0 12px 32px -22px var(--lg-shadow);
  -webkit-backdrop-filter: none; backdrop-filter: none;
}
[data-radar-skin="glass"] .library h2 { font-size: 17px; }
[data-radar-skin="glass"] .row {
  background: var(--glass-row); border-color: var(--glass-edge); min-height: 68px;
}
[data-radar-skin="glass"] .row:is(:active,.playing) { background: var(--glass-active); }
[data-radar-skin="glass"] :is(.title,.pl-title) { color: var(--txt); }
[data-radar-skin="glass"] :is(.artist,.rank,.pl-artist,.times,footer) { color: var(--dim); }
[data-radar-skin="glass"] :is(.cover,.pl-cover) { border-radius: 12px; background-color: var(--lg-solid); }
[data-radar-skin="glass"] :is(.icon,.row .add-song,.row .remove-song) {
  background: var(--glass-row); border: 1px solid var(--glass-edge); border-radius: 12px; color: var(--acc);
}
[data-radar-skin="glass"] :is(.library button,.playlist-tools button,.batch-tools button,.qbtn,.library-dialog button,.playlist-tools input,.playlist-tools select,.library-dialog input,.library-dialog select) {
  background: var(--glass-action); color: var(--txt); border: 1px solid var(--glass-edge); border-radius: 14px;
}
[data-radar-skin="glass"] :is(.qbtn .q-desc,.sheet .sh-title,.sheet .cancel) { color: var(--dim); }
[data-radar-skin="glass"] .player {
  left: 50%; right: auto; bottom: calc(10px + env(safe-area-inset-bottom));
  width: min(660px, calc(100% - 24px)); padding: 8px 12px;
  transform: translateX(-50%); border: 1px solid var(--glass-rim); border-radius: 24px;
  background: var(--glass-shine), var(--lg-solid);
  box-shadow: inset 0 -1px var(--glass-edge), 0 16px 44px -18px var(--lg-shadow);
}
[data-radar-skin="glass"] .player:not(.is-bubble) .play {
  color: var(--txt); background: var(--glass-shine), var(--glass-active);
  border: 1px solid var(--glass-rim); box-shadow: inset 0 -1px var(--glass-edge);
}
[data-radar-skin="glass"] .player.is-bubble {
  left: auto; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom));
  width: min(232px, calc(100% - 28px)); height: 52px; padding: 7px 10px; transform: none; border-radius: 16px;
  background: #fff; box-shadow: 0 8px 24px rgba(15,23,42,.16), 0 1px 3px rgba(15,23,42,.10);
}
[data-radar-skin="glass"] .player.is-bubble .pl-cover { border-radius: 10px; }
[data-radar-skin="glass"] .bar { background: var(--glass-edge); }
[data-radar-skin="glass"] .bar i { background: var(--acc); }
[data-radar-skin="glass"] :is(.sheet,.library-dialog) {
  border: 1px solid var(--glass-rim); border-radius: 24px;
  background: var(--glass-shine), var(--lg-solid); color: var(--txt);
  box-shadow: 0 18px 55px -18px var(--lg-shadow);
}

<script>
const HOSTS = ['https://api.qijieya.cn/meting/', 'https://api.injahow.cn/meting/'];
const CHARTS = [
  {id:'3778678', name:'热歌榜'},
  {id:'3779629', name:'新歌榜'},
  {id:'19723756', name:'飙升榜'},
  {id:'2884035', name:'原创榜'},
];
const SRCS = [
  {key:'netease', label:'网易云'},
  {key:'tencent', label:'QQ音乐'},
  {key:'kugou', label:'酷狗'},
];
const CHART_TTL = 10 * 60 * 1000;

const $ = s => document.querySelector(s);
const el = id => document.getElementById(id);
const audio = el('audio');
let list = [], cur = -1, curServer = 'netease', srcPick = 'netease', activeTab = CHARTS[0].id;

function toast(msg){
  const t = el('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 1900);
}
function fmt(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return m + ':' + String(s).padStart(2,'0');
}

// 多镜像 + 超时
async function api(params, timeout = 12000, options = {}){
  let lastErr;
  for (const host of options.host ? [options.host] : HOSTS){
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), timeout);
    try{
      const r = await fetch(host + '?' + params, {signal: ctl.signal, cache:'no-store'});
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      if (!Array.isArray(data)) throw new Error('接口返回格式错误');
      if (!data.length && !options.allowEmpty) throw new Error('empty');
      return {data, host};
    }catch(e){ lastErr = e; clearTimeout(timer); }
  }
  throw lastErr || new Error('network');
}

let playlistView=false, viewRequest=0;
let searchState=null;
function resetSearch(){
  searchState=null;
  el('searchPagerTop').hidden=true;
  el('searchPager').hidden=true;
}
function paintSearchPager(state){
  if(searchState!==state||state.request!==viewRequest)return;
  el('searchPagerTop').hidden=state.done;
  el('searchPager').hidden=false;
  for(const id of ['searchMoreTop','searchMore']){
    const button=el(id);
    button.hidden=state.done;
    button.disabled=state.loading;
    button.textContent=state.loading?'正在加载…':state.error?'重试加载更多':'加载更多歌曲';
  }
  el('searchPageStatus').textContent=state.error||
    (state.done?`已显示 ${state.items.length} 首 · 当前音乐源没有返回更多结果`:
      `已显示 ${state.items.length} 首 · 可继续加载`);
}
const selectedSongs=new Set();
let batchRunning=false, batchCancelled=false, batchController=null;
let savedPlaylists=[];
try { const stored=JSON.parse(localStorage.getItem('mr.playlists')||'[]'); if(Array.isArray(stored)) savedPlaylists=stored.filter(p=>['netease','tencent'].includes(p.server)&&/^\d+$/.test(p.id)).slice(0,50); } catch {}
const LIBRARY_KEY='mr.personal.v1', BOOKMARK_KEY='mr.personal.resume.v1';
function readStored(key,fallback){
  try{return JSON.parse(localStorage.getItem(key))??fallback;}catch{return fallback;}
}
function webUrl(value){
  try{const url=new URL(value);return /^https?:$/.test(url.protocol)?url.href:'';}catch{return '';}
}
function savedTrack(item,source){
  if(!item)return null;
  const url=webUrl(item.url);
  if(!url)return null;
  const params=new URL(url).searchParams;
  const server=params.get('server')||item.server||source||'';
  const id=String(params.get('id')||item.id||'');
  return {url,id,server,name:String(item.name||'未知曲目').slice(0,160),
    artist:String(item.artist||'').slice(0,160),pic:webUrl(item.pic),
    lrc:webUrl(item.lrc)||(/^\s*\[/.test(item.lrc)?String(item.lrc).slice(0,16000):'')};
}
function trackKey(track){return track.server&&track.id?JSON.stringify([track.server,track.id]):track.url;}
const storedLibrary=readStored(LIBRARY_KEY,[]);
let personalLists=Array.isArray(storedLibrary)?storedLibrary.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&Array.isArray(p.tracks)).map(p=>({...p,tracks:p.tracks.map(it=>savedTrack(it)).filter(Boolean)})):[];
let bookmark=readStored(BOOKMARK_KEY,null), activePersonalId=null, libraryAction=null;
const getPersonal=id=>personalLists.find(p=>p.id===id);
function getResume(){
  const playlist=bookmark&&getPersonal(bookmark.listId);
  if(!playlist)return null;
  const index=playlist.tracks.findIndex(it=>trackKey(it)===bookmark.song);
  return index<0?null:{playlist,index,seconds:Number.isFinite(bookmark.seconds)?Math.max(0,bookmark.seconds):0};
}
function paintLibrary(){
  const container=el('libraryLists');
  container.replaceChildren();
  container.hidden=!personalLists.length;
  el('libraryEmpty').hidden=!!personalLists.length;
  el('libraryManage').hidden=!getPersonal(activePersonalId);
  for(const playlist of personalLists){
    const b=document.createElement('button');b.type='button';b.textContent=`${playlist.name} · ${playlist.tracks.length} 首`;
    if(playlist.id===activePersonalId)b.setAttribute('aria-current','true');
    b.onclick=()=>showPersonal(playlist.id);container.append(b);
  }
  const resume=getResume(),button=el('resumeLibrary');
  button.hidden=!resume;
  if(resume)button.textContent=`继续播放 · ${resume.playlist.tracks[resume.index].name} · ${fmt(resume.seconds)}`;
}
function saveLibrary(lists){
  try{localStorage.setItem(LIBRARY_KEY,JSON.stringify(lists));}
  catch{throw new Error('浏览器无法保存歌单，存储可能已满或被禁用');}
  personalLists=lists;paintLibrary();
}
function showPersonal(id){
  const playlist=getPersonal(id);
  if(!playlist)return;
  ++viewRequest;resetSearch();activePersonalId=id;playlistView=true;
  el('hint').textContent=`${playlist.name} · ${playlist.tracks.length} 首`;
  render(playlist.tracks,false);paintLibrary();
}
function leavePersonal(){if(activePersonalId!==null){activePersonalId=null;paintLibrary();}}
function editLibrary(mode,items=[]){
  const tracks=items.map(it=>savedTrack(it,curServer)).filter(Boolean);
  if(mode==='add'&&!tracks.length)return toast('没有可保存的歌曲');
  const current=getPersonal(activePersonalId),target=el('libraryTarget');
  libraryAction={mode,tracks,id:current?.id};
  el('libraryDialogTitle').textContent=mode==='add'?`加入歌单 · ${tracks.length} 首`:mode==='rename'?'重命名歌单':'新建歌单';
  el('libraryTargetField').hidden=mode!=='add';
  target.replaceChildren();
  for(const p of personalLists)target.add(new Option(p.name,p.id));
  target.add(new Option('＋ 新建歌单',''));
  if(current)target.value=current.id;
  el('libraryName').value=mode==='rename'&&current?current.name:'';
  el('libraryError').textContent='';
  updateLibraryFields();el('libraryDialog').showModal();
  (el('libraryNameField').hidden?target:el('libraryName')).focus();
}
function updateLibraryFields(){
  const needsName=libraryAction?.mode!=='add'||!el('libraryTarget').value;
  el('libraryNameField').hidden=!needsName;
  el('libraryName').required=needsName;
}
el('createLibrary').onclick=()=>editLibrary('create');
el('renameLibrary').onclick=()=>editLibrary('rename');
el('cancelLibrary').onclick=()=>el('libraryDialog').close();
el('libraryTarget').onchange=()=>{updateLibraryFields();if(!el('libraryNameField').hidden)el('libraryName').focus();};
el('libraryForm').onsubmit=event=>{
  event.preventDefault();
  if(!libraryAction)return;
  const {mode,tracks,id}=libraryAction;
  const name=el('libraryName').value.trim();
  const target=mode==='add'?getPersonal(el('libraryTarget').value):getPersonal(id);
  let updated,added=0;
  try{
    if(!el('libraryNameField').hidden&&!name)throw new Error('请输入歌单名称');
    if(mode==='rename'){
      if(!target)return;
      updated={...target,name};
    }else if(mode==='create'||!target){
      if(personalLists.length>=50)throw new Error('最多保存 50 个个人歌单');
      updated={id:crypto.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),name,tracks:[]};
    }else updated={...target,tracks:[...target.tracks]};
    if(mode==='add'){
      const seen=new Set(updated.tracks.map(trackKey));
      for(const track of tracks){const key=trackKey(track);if(!seen.has(key)){seen.add(key);updated.tracks.push(track);added++;}}
    }
    const alreadySaved=getPersonal(updated.id);
    if(mode!=='add'||added||!alreadySaved)saveLibrary(alreadySaved?personalLists.map(p=>p.id===updated.id?updated:p):[...personalLists,updated]);
    el('libraryDialog').close();
    if(mode!=='add'||activePersonalId===updated.id)showPersonal(updated.id);
    if(mode==='add')toast(added?`已将 ${added} 首加入「${updated.name}」`:'这些歌曲已在歌单中');
  }catch(error){el('libraryError').textContent=error.message;}
};
el('deleteLibrary').onclick=()=>{
  const playlist=getPersonal(activePersonalId);
  if(!playlist||!window.confirm(`删除「${playlist.name}」？`))return;
  try{saveLibrary(personalLists.filter(p=>p.id!==playlist.id));loadChart();}catch(error){toast(error.message);}
};
function removePersonalTrack(index){
  const playlist=getPersonal(activePersonalId),song=playlist?.tracks[index];
  if(!song||!window.confirm(`从「${playlist.name}」移除《${song.name}》？`))return;
  try{
    saveLibrary(personalLists.map(p=>p.id===playlist.id?{...p,tracks:p.tracks.filter((_,i)=>i!==index)}:p));
    showPersonal(playlist.id);
  }catch(error){toast(error.message);}
}
el('resumeLibrary').onclick=()=>{
  const resume=getResume();if(!resume)return;
  showPersonal(resume.playlist.id);play(resume.index,resume.seconds);
};
el('addSelected').onclick=()=>editLibrary('add',[...selectedSongs].sort((a,b)=>a-b).map(i=>list[i]));

function parsePlaylist(input,source){
  input=input.trim();
  if(/^\d+$/.test(input)) return {server:source,id:input};
  const found=input.match(/https?:\/\/[^\s<>"'，。]+/i);
  if(!found) throw new Error('请粘贴完整歌单链接或数字 ID');
  const u=new URL(found[0]); let server,id;
  if(/(^|\.)music\.163\.com$/.test(u.hostname)||u.hostname==='163cn.tv'){

}

async function readFullPlaylist(ref,onProgress,isCurrent){
  if(location.protocol==='file:')throw new Error('请通过本机服务打开 http://127.0.0.1:18766/ ，文件预览无法调用完整歌单接口');
  const items=[],seen=new Set();let offset=0,total=null,title=ref.id;
  while(isCurrent()){
    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),45000);
    let page;
    try{
      const r=await fetch('/.netlify/functions/playlist?'+new URLSearchParams({server:ref.server,id:ref.id,offset:String(offset)}),{signal:ctl.signal,cache:'no-store'});
      if(r.status===404)throw new Error('完整歌单服务尚未部署，需同时部署 Netlify Functions；单独上传 HTML 无法启用');
      if(!(r.headers.get('content-type')||'').includes('application/json'))throw new Error('完整歌单服务未启用，请部署包含 Functions 的站点');
      page=await r.json();if(!r.ok)throw new Error(page.error||'读取歌单失败');
    }finally{clearTimeout(timer);}
    if(!isCurrent())return null;
    if(!Number.isSafeInteger(page.total)||page.total<0||!Array.isArray(page.items)||!Number.isSafeInteger(page.nextOffset))throw new Error('歌单服务返回无效分页数据');
    if(total!==null&&total!==page.total)throw new Error('歌单在导入期间发生变化，请重新导入');
    total=page.total;title=page.title||title;
    // Keep every playlist position, including duplicate tracks. Detect a backend that ignores offset.
    const signature=JSON.stringify(page.items.map(it=>it.id||it.url));
    if(page.items.length&&seen.has(signature))throw new Error('平台重复返回同一页，已保留 '+items.length+'/'+total+' 首，请稍后重试');
    seen.add(signature);
    if(page.nextOffset!==offset+page.items.length||page.nextOffset>total)throw new Error('分页位置与曲目数量不一致');
    items.push(...page.items);onProgress(items,total,title);
    if(page.complete){if(items.length!==total)throw new Error('平台未返回完整歌单');return {items,total,title};}
    if(page.nextOffset<=offset)throw new Error('平台未返回后续曲目，已读取 '+items.length+'/'+total+' 首');
    offset=page.nextOffset;
  }
  return null;
}

function audioFormat(bytes){
  const s = String.fromCharCode(...bytes.slice(0,12));
  if (s.startsWith('fLaC')) return ['flac','audio/flac'];
  if (s.startsWith('OggS')) return ['ogg','audio/ogg'];
  if (s.startsWith('RIFF') && s.slice(8,12)==='WAVE') return ['wav','audio/wav'];
  if (s.startsWith('ID3') || (bytes[0]===255 && (bytes[1]&224)===224)) return ['mp3','audio/mpeg'];
  if (s.slice(4,8)==='ftyp') return ['m4a','audio/mp4'];
  if (bytes[0]===26 && bytes[1]===69 && bytes[2]===223 && bytes[3]===163) return ['webm','audio/webm'];
  throw new Error('服务器没有返回可识别的音频');
}
function songFilename(item, ext){
  const clean = s => String(s).replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').trim().slice(0,90);
  return clean(item.name||'未知曲目') + ' - ' + clean(item.artist||'未知歌手') + '.' + ext;
}

function withQuality(url, quality){
  try{
    const u = new URL(url, location.href);
    if (quality === 'flac') u.searchParams.set('br','999000');
    else u.searchParams.delete('br');
    return u.toString();
  }catch(e){
    if (quality !== 'flac') return url;
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'br=999000';
  }
}
async function doDownload(item, button, quality, signal){
  if (!item) return {ok:false};
  const ctl = new AbortController();
  const cancel=()=>ctl.abort();
  if(signal){signal.addEventListener('abort',cancel,{once:true});if(signal.aborted)ctl.abort();}
  const timer = setTimeout(()=>ctl.abort(),300000);
  const oldLabel = button ? button.textContent : '⬇';
  if (button){ button.disabled = true; button.textContent = '…'; }
  toast(quality === 'flac' ? '正在获取无损音频，文件较大请稍候…' : '正在准备音频，完成后按歌名保存');
  try {
    let downloadUrl=withQuality(item.url,quality);
    if(['netease','tencent','kugou'].includes(playbackPlatform(item))){const result=await resolvePlayback(item,ctl.signal);downloadUrl=result.url;}
    const r = await fetch(downloadUrl, {signal: ctl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.arrayBuffer();
    if (!data.byteLength) throw new Error('接口返回空文件，可能该曲暂无此音质');
    const [ext, mime] = audioFormat(new Uint8Array(data));
    const filename = songFilename(item, ext);
    const url = URL.createObjectURL(new Blob([data], {type: mime}));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 180000);
    const mb = (data.byteLength / 1048576).toFixed(1);
    if (quality === 'flac' && ext !== 'flac') toast('该曲暂无无损，已保存 ' + ext.toUpperCase() + '（' + mb + ' MB）');
    else toast('已下载：' + filename + '（' + mb + ' MB）');
    return {ok:true,fallback:quality==='flac'&&ext!=='flac'};
  } catch(e) {
    if(signal?.aborted)return {ok:false,cancelled:true};
    toast('下载失败：' + (e.name === 'AbortError' ? '请求超时，请重试' : e.message));
    return {ok:false};
  } finally {
    if(signal)signal.removeEventListener('abort',cancel);
    clearTimeout(timer);
    if (button){ button.disabled = false; button.textContent = oldLabel; }
  }
}

}

function parseLrc(text){
  const offsetMatch = text.match(/\[offset:([+-]?\d+)\]/i);
  const offset = offsetMatch ? Number(offsetMatch[1])/1000 : 0;
  const lines = [];
  for (const raw of text.split(/\r?\n/)){
    const tags = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const body = raw.replace(/\[[^\]]*\]/g,'').trim();
    if (!body || !tags.length) continue;
    const wordTags = [...body.matchAll(/<(\d+):(\d+(?:\.\d+)?)>/g)];
    let words = [];
    let cursor = 0;
    let wordTime = null;
    for (const tag of wordTags){
      const before = body.slice(cursor,tag.index);
      if (before) words.push({time:wordTime,text:before});
      wordTime = Math.max(0,Number(tag[1])*60+Number(tag[2])+offset);
      cursor = tag.index+tag[0].length;
    }
    const tail = body.slice(cursor);
    if (tail) words.push({time:wordTime,text:tail});
    const cleanText = words.map(word=>word.text).join('').trim();
    if (!cleanText) continue;
    for (const tag of tags){
      const time = Math.max(0,Number(tag[1])*60+Number(tag[2])+offset);
      const lineWords = words.map(word=>({time:word.time===null?time:word.time,text:word.text}));
      lines.push({time,text:cleanText,words:lineWords,wordTimed:wordTags.length>0});
    }
  }
  return lines.sort((a,b)=>a.time-b.time);
}
async function loadLyrics(item){

  if (!item.lrc){ el('lyrics').innerHTML = '<p>这首歌暂无歌词</p>'; el('lyricDockText').textContent='暂无歌词'; el('nowLyricBadge').textContent='纯音乐'; return; }

        svg('feBlend', { in: 'red', in2: 'green', mode: 'screen', result: 'rg' }),
        svg('feBlend', { in: 'rg', in2: 'blue', mode: 'screen', result: 'rgb' }),
        svg('feComposite', { in: 'rgb', in2: 'warp', operator: 'in', result: 'dispersed' }));
      blur.setAttribute('in', 'dispersed');
      split = { red, blue };
    }
    filter.append(blur);
    defs.append(filter);
    lenses.set(element, { filter, image, warp, blur, split, baseScale: 0 });
    observer?.observe(element);
    updateLens(element);
  }

  function addGlint(element) {
    if (glints.has(element)) return;
    glints.add(element);
    element.addEventListener('pointermove', event => {
      const rect = element.getBoundingClientRect();
      element.style.setProperty('--lg-pointer-x', `${event.clientX - rect.left}px`);
      element.style.setProperty('--lg-pointer-y', `${event.clientY - rect.top}px`);
    });
    element.addEventListener('pointerleave', () => {
      element.style.removeProperty('--lg-pointer-x');
      element.style.removeProperty('--lg-pointer-y');
    });
  }

  function addDock(dock) {
    if (docks.has(dock)) return;
    const pill = dock.querySelector('.lg-dock-pill');
    const buttons = [...dock.querySelectorAll('button[data-lg-tab]')];
    if (!pill || !buttons.length) return;
    docks.add(dock);
    const count = buttons.length;
    const indexOf = target => buttons.indexOf(target.closest('button[data-lg-tab]'));
    let selected = Math.max(0, buttons.findIndex(button => button.getAttribute('aria-pressed') === 'true'));
    let cursor = selected;
    let press = 0;
    let panel = 0;
    let velocity = 0;
    let frameId = 0;
    let drag = null;
    let suppressClickUntil = 0;
    dock.style.setProperty('--lg-tabs', count);

    function render() {
      const direction = getComputedStyle(dock).direction === 'rtl' ? -1 : 1;
      const width = (dock.clientWidth - 8) / count;
      const speed = clamp(velocity, -.2, .2);
      const scale = reducedMotion.matches ? 1 : 1 + (78 / 56 - 1) * press;
      dock.style.setProperty('--lg-panel-x', `${panel}px`);
      dock.style.setProperty('--lg-pill-x', `${direction * cursor * width}px`);
      dock.style.setProperty('--lg-sx', scale / (1 - speed * .75));
      dock.style.setProperty('--lg-sy', scale * (1 - speed * .25));
      pill.style.setProperty('--lg-glint-opacity', .35 + .55 * press);
      pill.style.setProperty('--lg-press', press);
      const lens = lenses.get(pill);
      if (lens) setDisplacement(lens, 10 * press);
      buttons.forEach((button, index) => {
        button.style.setProperty('--lg-selected', `${clamp(1 - Math.abs(cursor - index), 0, 1) * 100}%`);
      });
    }

    function settle() {
      cancelAnimationFrame(frameId);
      if (reducedMotion.matches) {
        cursor = selected;
        press = panel = velocity = 0;
        render();
        return;
      }
      let lastTime;
      let springSpeed = 0;
      function step(time) {
        const dt = Math.min(24, lastTime ? time - lastTime : 16) / 1000;
        lastTime = time;
        springSpeed += (285 * (selected - cursor) - 28 * springSpeed) * dt;
        cursor += springSpeed * dt;
        const fade = Math.exp(-16 * dt);
        press *= fade;
        panel *= fade;
        velocity *= fade;
        if (Math.abs(cursor - selected) + Math.abs(springSpeed) + press + Math.abs(panel) < .012) {
          cursor = selected;
          press = panel = velocity = 0;
          render();
          return;
        }
        render();
        frameId = requestAnimationFrame(step);
      }
      frameId = requestAnimationFrame(step);
    }

    function select(index) {
      if (index < 0 || index >= count) return;
      const changed = selected !== index;
      selected = index;
      buttons.forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
      settle();
      if (changed) dock.dispatchEvent(new CustomEvent('lg:tabchange', { bubbles: true, detail: { index, button: buttons[index] } }));
    }

    function pressIn() {
      cancelAnimationFrame(frameId);
      if (reducedMotion.matches) return;
      let start;
      const initial = press;
      function step(time) {
        start ??= time;
        const progress = clamp((time - start) / 140, 0, 1);
        press = initial + (1 - initial) * (1 - (1 - progress) ** 3);
        render();
        if (progress < 1) frameId = requestAnimationFrame(step);
      }
      frameId = requestAnimationFrame(step);
    }

    dock.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0 || drag) return;
      const target = indexOf(event.target);
      if (target < 0) return;
      suppressClickUntil = 0;
      const rect = dock.getBoundingClientRect();
      drag = { id: event.pointerId, x: event.clientX, from: selected, lastX: event.clientX, time: event.timeStamp,
        direction: getComputedStyle(dock).direction === 'rtl' ? -1 : 1, width: rect.width, active: false };
      pressIn();
    });
    window.addEventListener('pointermove', event => {
      if (!drag || drag.id !== event.pointerId) return;
      const dx = event.clientX - drag.x;
      if (!drag.active && Math.abs(dx) < 6) return;
      if (!drag.active) {
        drag.active = true;
        dock.setPointerCapture(event.pointerId);
      }
      cursor = clamp(drag.from + drag.direction * dx / ((drag.width - 8) / count), 0, count - 1);
      const portion = clamp(dx / drag.width, -1, 1);
      panel = reducedMotion.matches ? 0 : 4 * Math.sign(portion) * (1 - (1 - Math.abs(portion)) ** 2);
      velocity = reducedMotion.matches ? 0 : (event.clientX - drag.lastX) / Math.max(10, event.timeStamp - drag.time) * .11;
      drag.lastX = event.clientX;
      drag.time = event.timeStamp;
      render();
    });
    function finish(event, cancelled) {
      if (!drag || drag.id !== event.pointerId) return;
      const wasActive = drag.active;
      drag = null;
      if (wasActive) suppressClickUntil = performance.now() + 300;
      select(wasActive && !cancelled ? Math.round(cursor) : selected);
    }
    window.addEventListener('pointerup', event => finish(event, false));
    window.addEventListener('pointercancel', event => finish(event, true));
    dock.addEventListener('lostpointercapture', event => {
      if (event.target === dock) finish(event, true);
    });
    dock.addEventListener('click', event => {
      if (event.detail && performance.now() < suppressClickUntil) return;
      select(indexOf(event.target));
    });
    dock.addEventListener('keydown', event => {
      const index = indexOf(event.target);
      if (index < 0) return;
      const direction = getComputedStyle(dock).direction === 'rtl' ? -1 : 1;
      const next = { ArrowLeft: index - direction, ArrowRight: index + direction, Home: 0, End: count - 1 }[event.key];
      if (next === undefined) return;
      event.preventDefault();
      const target = clamp(next, 0, count - 1);
      buttons[target].focus();
      select(target);
    });
    if ('ResizeObserver' in window) new ResizeObserver(render).observe(dock);
    else window.addEventListener('resize', render);
    window.addEventListener('lg:theme', render);
    render();
  }

  function init(root = document) {
    const each = (selector, fn) => {
      if (root.matches?.(selector)) fn(root);
      root.querySelectorAll(selector).forEach(fn);
    };
    each('.lg[data-lg-lens]', element => lenses.has(element) ? updateLens(element) : addLens(element));
    each('.lg-glint', addGlint);
    each('.lg-dock', addDock);
  }
  window.LiquidGlass = Object.freeze({ init });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => init(), { once: true });
  else init();
})();

(() => {
  'use strict';
  const root = document.documentElement;
  const toggles = document.querySelectorAll('[data-appearance]');
  const homeLabel = document.querySelector('[data-appearance-label]');
  const search = document.querySelector('[data-glass-search]');
  const themeColor = document.querySelector('meta[name="theme-color"]');
  const defaultThemeColor = themeColor.content;

  function applyAppearance() {
    const glass = root.dataset.radarSkin === 'glass';
    homeLabel.textContent = glass ? '液态玻璃' : 'MIUIX';
    for (const button of toggles) {
      button.setAttribute('aria-pressed', String(glass));
      button.title = glass ? '切换为 MIUIX' : '切换为液态玻璃';
    }
    search.classList.toggle('lg', glass);
    search.classList.toggle('lg-search', glass);
    search.toggleAttribute('data-lg-lens', glass);
    if (glass) window.LiquidGlass.init(search);
    themeColor.content = glass ? (root.dataset.lgTheme === 'dark' ? '#111c2c' : '#e6eef7') : defaultThemeColor;
  }

  for (const button of toggles) {
    button.addEventListener('click', () => {
      const skin = root.dataset.radarSkin === 'glass' ? 'miuix' : 'glass';
      root.dataset.radarSkin = skin;
      try { localStorage.setItem('musicRadar.appearance', skin); } catch { /* Apply in memory. */ }
      applyAppearance();
    });
  }
  window.addEventListener('lg:theme', applyAppearance);
  applyAppearance();
})();
</script>
</body>
</html>
