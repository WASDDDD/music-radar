# Render 蓝图（免费方案，无需信用卡）
# 用法：把本目录推到 GitHub，在 Render 新建 Blueprint 选中该仓库即可。
services:
  - type: web
    name: music-radar
    runtime: python
    plan: free
    buildCommand: "true"
    startCommand: "python3 server.py --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MUSICRADAR_DB
        value: /tmp/music.sqlite3
      - key: PYTHON_VERSION
        value: "3.12.6"
