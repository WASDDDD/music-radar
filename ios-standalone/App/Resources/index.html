<script>
/* Establish the Miuix skin and colour theme before first paint. */
(() => {
  'use strict';
  const root = document.documentElement;
  root.dataset.radarSkin = 'miuix';
  let theme = '';
  try {
    if (window.MRHost && window.MRHost.theme) theme = window.MRHost.theme() || '';
  } catch (e) {}
  if (!theme) {
    try {
      theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    } catch (e) { theme = 'dark'; }
  }
  root.dataset.theme = theme;
})();
</script>

/* ===== 层级切换过渡：一级 ⇄ 二级 ===== */
/* 二级页进入/退场统一交给 Motion（内联样式），这里只保留指针行为。
   注意：不要再给 .now-page.on 加 CSS animation —— 它的优先级高于内联样式，
   会和 Motion 抢 transform/opacity，表现为首帧抖动或整段动画被吞掉。 */
.now-page.closing{pointer-events:none}

/* 列表视图切换（榜单 ⇄ 搜索 ⇄ 歌单 ⇄ 个人歌单）：内容淡入上浮 */



/* 底栏播放器进入播放页时轻微下沉，呼应二级页上浮 */
body.page-open .player{opacity:.72;transition:opacity .24s ease}
body.page-open::after{opacity:.5;transition:opacity .3s ease}

/* 底部弹层（音质选择/队列）：加一层淡入遮罩，进出都有过渡 */
.sheet,.queue-sheet{will-change:transform}
.sheet:not(.on),.queue-sheet:not(.on){pointer-events:none}

/* 弹窗（新建/重命名歌单）进出 */
.library-dialog[open]{animation:dlg-enter .26s cubic-bezier(.16,.84,.28,1) both}
.library-dialog[open]::backdrop{animation:fade-in .22s ease both}
@keyframes dlg-enter{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

/* 减少动态效果时全部退化为纯淡入 */
@media(prefers-reduced-motion:reduce){
  .now-page.on,.now-page.closing,.library-dialog[open]{animation-duration:.01ms!important}
  body.page-open .player{transform:none;opacity:1}
}
/* Continuous cover-to-lyrics transport transition. */
.now-pages{scroll-behavior:smooth}
.now-page:not(.lyrics-mode) .now-bottom{position:absolute;left:50%;right:auto;bottom:var(--sa-bottom);width:calc(100% - 28px);height:146px;max-width:560px;margin:0;padding:15px 22px calc(17px + var(--sa-bottom));display:flex;flex-direction:column;justify-content:flex-end;transform:translateX(-50%);transition:left .42s cubic-bezier(.2,.75,.25,1),width .42s cubic-bezier(.2,.75,.25,1),height .42s cubic-bezier(.2,.75,.25,1),padding .38s ease,border-radius .38s ease,background .34s ease,box-shadow .38s ease,opacity .3s ease}
.now-page.lyrics-mode .now-bottom{position:absolute;left:50%;right:auto;bottom:var(--sa-bottom);width:100%;height:64px;max-width:600px;margin:0;padding:4px 28px 8px;display:flex;flex-direction:column;justify-content:flex-end;transform:translateX(-50%);transition:left .42s cubic-bezier(.2,.75,.25,1),width .42s cubic-bezier(.2,.75,.25,1),height .42s cubic-bezier(.2,.75,.25,1),padding .38s ease,border-radius .38s ease,background .34s ease,box-shadow .38s ease,opacity .3s ease}
.now-page:not(.lyrics-mode) .now-bottom input,.now-page.lyrics-mode .now-bottom input{display:block!important;flex:none;max-height:24px;height:18px;margin:0;opacity:1;transform:translateY(0);transition:max-height .34s ease,height .34s ease,opacity .2s ease,transform .34s ease,margin .34s ease}
.now-page:not(.lyrics-mode) .now-bottom .now-time,.now-page.lyrics-mode .now-bottom .now-time{display:flex!important;flex:none;max-height:24px;height:auto;opacity:1;overflow:hidden;transform:translateY(0);transition:max-height .34s ease,height .34s ease,opacity .2s ease,transform .34s ease,margin .34s ease}
.now-controls{transition:gap .4s cubic-bezier(.2,.75,.25,1),margin .38s ease,transform .4s cubic-bezier(.2,.75,.25,1)}
.now-page.lyrics-mode .now-bottom input,.now-page.lyrics-mode .now-bottom .now-time{max-height:0!important;height:0!important;margin:0!important;padding:0;opacity:0;transform:translateY(8px);pointer-events:none}
.now-page.lyrics-mode .now-controls{transform:translateY(0)}
/* Reserve and animate the transport footprint while horizontal pages swap. */
.now-page:not(.lyrics-mode) .now-pages{margin-bottom:146px;transition:margin-bottom .42s cubic-bezier(.2,.75,.25,1)}
.now-page.lyrics-mode .now-pages{margin-bottom:64px;transition:margin-bottom .42s cubic-bezier(.2,.75,.25,1)}
@media(prefers-reduced-motion:reduce){.now-pages{transition:none!important}}

.now-head { display: grid; grid-template-columns: 1fr auto 1fr; padding-inline: clamp(8px, 3vw, 20px); }
.now-head #nowClose { justify-self: start; }
.now-actions { display: flex; justify-self: end; align-items: center; }
.now-head .now-actions button {
  width: auto; min-width: 44px; min-height: 44px; padding: 0 4px;
  font-size: 13px; color: #d7e3f3;
}
:root[data-radar-skin="miuix"] { color-scheme: light; }
:root[data-radar-skin="miuix"][data-theme="dark"]{ color-scheme: dark; }


.search-pager { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 14px 0; color: var(--dim); font-size: 13px; }
.search-pager[hidden] { display: none; }
.search-pager button { min-height: 44px; padding: 10px 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--acc); font-weight: 600; cursor: pointer; }
.search-pager button:disabled { opacity: .65; cursor: wait; }
.search-pager button:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }

/* Keep transport controls directly on the album backdrop. */
.now-page .now-bottom {
  background: transparent !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  -webkit-backdrop-filter: none !important;
  backdrop-filter: none !important;
}

/* Keep upstream playback failures visible, including in lyrics mode. */
.playback-notice{position:absolute;z-index:8;left:50%;bottom:calc(152px + var(--sa-bottom));transform:translateX(-50%);width:min(90%,500px);padding:12px 14px;border:1px solid #ffffff26;border-radius:16px;background:#152034f5;color:#f2f5fc;font-size:13px;line-height:1.6;box-shadow:0 8px 28px #0004}
.playback-notice[hidden]{display:none}.playback-notice p{margin:0}.playback-notice .recovery-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.playback-notice button{border:1px solid #ffffff33;border-radius:10px;padding:7px 10px;background:#ffffff12;color:inherit;font-size:12px}.playback-notice button[hidden]{display:none}.now-page.lyrics-mode .playback-notice{bottom:calc(78px + var(--sa-bottom))}

/* 底栏改为圆角悬浮卡片（MIUIX 皮肤） */
.player:not(.is-bubble){
  left:12px;right:12px;width:calc(100% - 24px);
  height:calc(96px + var(--sa-bottom));
  bottom:calc(10px + var(--sa-bottom));
  padding:10px 16px calc(10px + var(--sa-bottom));border:1px solid var(--line);border-radius:22px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:0 10px 30px rgba(15,23,42,.14),0 1px 3px rgba(15,23,42,.08);
}
:root[data-theme="dark"] .player:not(.is-bubble){background:rgba(34,36,40,.9);border-color:#3b3d42}
@media(prefers-reduced-transparency:reduce){
  .player:not(.is-bubble){background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none}
}
body{padding-bottom:calc(122px + var(--sa-bottom))}
@media(min-width:900px){
  .player:not(.is-bubble){width:min(680px,calc(100% - 32px));left:50%;right:auto;transform:translateX(-50%);bottom:12px;border-radius:22px;height:auto}
}

/* ===== 汽水风格：暖色主题（主色由封面动态写入 :root） ===== */
:root{
  --hot:#ff5a36; --hot2:#ff8a4c; --hot-soft:#ffb08a; --hot-deep:#f4511e;
  --hot-rgb:255,90,54; --hot2-rgb:255,138,76;
}
/* 暖色氛围叠加 */
.now-ambient::after{background:linear-gradient(180deg,rgba(var(--hot-rgb),.34) 0%,rgba(var(--hot2-rgb),.22) 42%,rgba(10,6,5,.96) 100%)!important}
/* 随封面变化的多层渐变（主色由脚本写入 --hot / --hot2 / --hot-soft） */
.now-ambient{background:
  radial-gradient(120% 80% at 18% 8%,rgba(var(--hot2-rgb),.42),transparent 62%),
  radial-gradient(110% 70% at 88% 96%,rgba(var(--hot-rgb),.38),transparent 66%),
  #070b12!important;transition:background .55s ease}
.now-page{background:
  radial-gradient(130% 90% at 22% 4%,rgba(var(--hot2-rgb),.30),transparent 60%),
  radial-gradient(120% 86% at 84% 100%,rgba(var(--hot-rgb),.34),transparent 64%),
  linear-gradient(160deg,#12100f,#080a10 62%)!important;
  transition:background .55s ease}
.now-page .now-bottom,.now-page.lyrics-mode .now-bottom{background:linear-gradient(180deg,transparent,rgba(var(--hot-rgb),.16) 46%,rgba(6,8,12,.9) 100%)!important}
.now-page:not(.lyrics-mode) .now-bottom{border-color:rgba(var(--hot2-rgb),.22)!important;background:rgba(9,10,14,.72)!important}
.record{border:1px solid rgba(var(--hot2-rgb),.35)!important;box-shadow:0 18px 52px rgba(var(--hot-rgb),.34),0 0 0 1px rgba(255,255,255,.04)!important}
/* 顶部收起/下载 文字：暖白 */
.now-head #nowClose,.now-head #nowDownload{color:#f0dcd0}
.now-tabs button{color:#b09889}.now-tabs button.on{color:var(--hot-soft)}
.now-tabs button::after{background:var(--hot2)}
/* 主播放键：橙红实心圆 */
.now-controls .main-play{
  background:linear-gradient(135deg,var(--hot2),var(--hot-deep))!important;
  color:#fff!important;box-shadow:0 8px 26px rgba(var(--hot-rgb),.42)!important
}
.now-page:not(.lyrics-mode) .now-controls .main-play{background:linear-gradient(135deg,var(--hot2),var(--hot-deep))!important;color:#fff!important;box-shadow:0 8px 26px rgba(var(--hot-rgb),.42)!important}
.now-page.lyrics-mode .now-controls .main-play{background:linear-gradient(135deg,var(--hot2),var(--hot-deep))!important;color:#fff!important;box-shadow:0 6px 20px rgba(var(--hot-rgb),.36)!important}
.lyric-dock #lyricDockPlay{background:linear-gradient(135deg,var(--hot2),var(--hot-deep))!important;color:#fff!important}
/* 上下首：纯白图标，无框无底 */
.now-page:not(.lyrics-mode) .now-controls button{border:0!important;background:transparent!important;box-shadow:none!important;color:#f3e9e2!important;font-size:28px!important}
.now-page:not(.lyrics-mode) .now-controls button:active{background:#ffffff12!important;color:#fff!important}
.now-page.lyrics-mode .now-controls button{color:#e8d6cc!important}
/* 进度条：细 + 橙红填充 + 白点 */
.now-page:not(.lyrics-mode) .now-bottom input::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--hot2) 0%,var(--hot) var(--seek-fill,0%),#6a554b var(--seek-fill,0%),#6a554b 100%)!important}
.now-page:not(.lyrics-mode) .now-bottom input::-webkit-slider-thumb{background:#fff!important;box-shadow:0 1px 6px #0009!important;width:12px!important;height:12px!important;margin-top:-4.5px!important}
.now-page:not(.lyrics-mode) .now-bottom input::-moz-range-progress{background:var(--hot)!important}
.now-page:not(.lyrics-mode) .now-bottom input::-moz-range-thumb{background:#fff!important}
.now-time{color:#d8c3b7!important}
/* 充电唱片唱臂：暖铜色 */
.tonearm{border-left-color:#e0b79f!important}
.tonearm::before{background:#e9c3aa!important;border-color:#5a4136!important;box-shadow:0 0 0 8px #3a2820aa!important}
.tonearm i{background:linear-gradient(90deg,#a9785c,#e9c3aa 45%,#8a5e47)!important}
.tonearm b{background:#f0dccb!important}
/* 歌名/歌手/徽章/心形 */
.now-title{color:#fff}
.now-artist{color:#d8bfb1}
.track-badges span{background:#ffffff10;border-color:#ffffff1c;color:#e7d3c7}
.track-title-line .heart,.lyrics-head .heart{color:#f0c9b8}
.track-title-line .heart.liked,.lyrics-head .heart.liked{color:var(--hot)!important;border-color:rgba(var(--hot-rgb),.4);background:rgba(var(--hot-rgb),.13);text-shadow:0 0 14px rgba(var(--hot-rgb),.55)}
/* 歌词：暗字 + 橙红逐字高亮 */
.lyrics p{color:#9c897e}
.lyrics p.active{color:#ffb08a}
.lyrics p.active::before{background:var(--hot)!important;box-shadow:0 0 14px rgba(var(--hot-rgb),.85)!important}
.lyric-word{background:linear-gradient(90deg,#ffd0b3 var(--word-progress,0%),#a0725c var(--word-progress,0%))!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important}
.lyrics p:not(.active) .lyric-word{background:linear-gradient(90deg,#b09a8d,#866e62)!important;-webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important}
.lyric-dock{border-color:rgba(var(--hot2-rgb),.30)!important;background:rgba(24,18,16,.82)!important}
.lyrics-head strong{color:#fff}.lyrics-head small{color:#cbb4a6}


/* 唱片改为暖棕木质，收起按钮去蓝框 */
.now-page .record{
  background:radial-gradient(circle at 50% 50%,#1a0f0a 0 13%,transparent 13.5%),
    repeating-radial-gradient(circle at center,#3a2418 0 2px,#5c3b26 2.6px 3.5px,#2e1c12 4px 5px)!important;
  border-color:#a5704faa!important;
  box-shadow:0 22px 70px #000b,0 0 0 12px #5c3b2633,0 0 80px #ff6a3655!important
}
.now-page .record::before{border-color:#d59a725c!important;box-shadow:inset 0 0 24px #ffab8225,0 0 22px #ff6a3644!important}
.now-page .record::after{background:#f0dccb!important;box-shadow:0 0 0 7px #6b3f28,0 0 16px #ffab8288!important}
.now-page .record img{border-color:#1a0f0a!important;box-shadow:0 0 0 2px #d59a7266,0 0 18px #0008!important;background:#3a2418!important}
.now-head #nowClose,.now-head #nowDownload,.now-tabs button{outline:none!important}
.now-head #nowClose:focus,.now-head #nowDownload:focus,.now-tabs button:focus{outline:none!important;box-shadow:none!important}


/* ===== 底部控制区照汽水：5 键 + 循环/列表面板 ===== */
.now-page .now-controls{gap:26px;align-items:center}
.now-page .now-controls .ctl-side{font-size:22px!important;color:#cdbbaF!important;width:34px;min-width:34px}
.now-page .now-controls #nowLoop[aria-pressed="true"]{color:var(--hot2)!important;text-shadow:0 0 12px rgba(var(--hot-rgb),.55)}
.now-page.lyrics-mode .now-controls{gap:clamp(20px,8vw,40px)}
.now-page.lyrics-mode .now-controls .ctl-side{font-size:18px!important;width:32px;min-width:32px;color:#c3ab9c!important}
/* 播放队列面板 */
.queue-sheet{position:fixed;left:0;right:0;bottom:0;z-index:75;background:rgba(24,16,12,.97);border-top:1px solid #ff8a4c33;border-radius:20px 20px 0 0;padding:14px 16px calc(16px + var(--sa-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.75,.25,1);box-shadow:0 -10px 34px #0009;max-height:64vh;display:flex;flex-direction:column}
.queue-sheet.on{transform:translateY(0)}
.queue-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;color:#f3e2d7}
.queue-head strong{font-size:15px;font-weight:600}
.queue-head span{font-size:12px;color:#b79f90;flex:1}
.queue-head button{border:0;background:transparent;color:#cdb7a8;font-size:18px;padding:2px 8px}
.queue-list{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.queue-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 8px;border:0;border-radius:10px;background:transparent;color:#e8d6cb;text-align:left;font-size:13px}
.queue-item .qi-no{width:20px;color:#a98f80;font-size:12px;flex:none}
.queue-item .qi-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-item .qi-art{font-size:11px;color:#9c8477;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue-item.cur{background:rgba(var(--hot-rgb),.14);color:var(--hot-soft)}
.queue-item.cur .qi-no{color:var(--hot2)}

/* ===== 手机端适配（MIUIX 风格 + 全面屏手势） ===== */
/* 底栏几何修正：高度不含安全区，安全区只在 bottom 用一次，避免重复叠加 */
body{padding-bottom:calc(118px + var(--sa-bottom))}
.player:not(.is-bubble){
  height:auto;
  min-height:96px;
  bottom:calc(10px + var(--sa-bottom));
  padding:11px 16px 12px;
  padding-left:calc(16px + var(--sa-left));
  padding-right:calc(16px + var(--sa-right));
}
.player.is-bubble{
  height:56px;
  bottom:calc(12px + var(--sa-bottom));
  padding:7px 10px;
}
/* 整页底部辉光：短列表时下方不再是死黑，始终带当前歌曲主色 */
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(140% 52% at 50% 104%, rgba(var(--hot-rgb),.22) 0%, rgba(var(--hot2-rgb),.11) 34%, rgba(0,0,0,0) 68%),
    radial-gradient(120% 38% at 12% 100%, rgba(var(--hot2-rgb),.10) 0%, rgba(0,0,0,0) 60%);
  background-attachment:fixed;
  background-repeat:no-repeat;
  transition:background-image .6s ease;
}

/* 底部渐变：从透明平滑过渡到背景色，再叠一层当前歌曲主色的柔光，把底部铺满不留死黑 */
body::after{
  content:'';position:fixed;left:0;right:0;bottom:0;z-index:29;pointer-events:none;
  height:calc(150px + var(--sa-bottom));
  background:
    radial-gradient(120% 120% at 50% 140%, rgba(var(--hot-rgb),.18) 0%, rgba(var(--hot2-rgb),.09) 42%, rgba(0,0,0,0) 76%),
    linear-gradient(180deg,
      rgba(0,0,0,0) 0%,
      color-mix(in srgb, var(--bg) 34%, transparent) 38%,
      color-mix(in srgb, var(--bg) 78%, transparent) 66%,
      var(--bg) 84%,
      var(--bg) 100%);
  transition:background .6s ease;
}
/* 列表末行融入底部渐变，不再被硬切一刀 */
#list{
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 34px),transparent 100%);
  mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 34px),transparent 100%);
}
/* 应用感：禁止长按选中界面文字（输入框除外） */
body{-webkit-user-select:none;user-select:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
/* 手势区避让：底部最后一行不被手势条压住 */
#list{padding-bottom:2px}
/* 列表最后一行与播放器保持呼吸间距 */
main{padding-bottom:8px}
#list{margin-bottom:4px}

/* 原生侧通过 --sa-* / --appbar 注入真实内边距，替代恒为 0 的 env() */
body{
  padding-left:var(--sa-left);
  padding-right:var(--sa-right);
  padding-bottom:calc(142px + var(--sa-bottom));
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
}
header{
  padding-top:calc(14px + var(--sa-top));
  padding-left:calc(16px + var(--sa-left));
  padding-right:calc(16px + var(--sa-right));
}
.player{
  padding-bottom:calc(11px + var(--sa-bottom));
  padding-left:calc(16px + var(--sa-left));
  padding-right:calc(16px + var(--sa-right));
}
.player.is-bubble{
  bottom:calc(14px + var(--sa-bottom));
  left:calc(100% - var(--sa-right) - 14px - min(232px, 100% - 28px));
}
.now-page{
  padding-top:var(--sa-top);
  padding-bottom:var(--sa-bottom);
  padding-left:var(--sa-left);
  padding-right:var(--sa-right);
  height:100dvh;
  overscroll-behavior:contain;
}
.now-head{padding-top:10px}
.now-page:not(.lyrics-mode) .now-bottom{bottom:var(--sa-bottom)}
.now-page.lyrics-mode .now-bottom{bottom:var(--sa-bottom)}
.queue-sheet{padding-bottom:calc(16px + var(--sa-bottom))}
.sheet{padding-bottom:calc(16px + var(--sa-bottom))}
/* 全面屏手势：底部左右滑返回、顶部下拉不误触 */
.now-pages{overscroll-behavior-x:contain}
.lyrics{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
/* 可点区域加大到 44px 触控标准 */
.row{min-height:64px}
.icon{width:40px;height:40px}
.tab{padding:9px 15px}
.qbtn{padding:14px}
/* 滚动条隐藏，更接近原生 */
.tabs,.tabs::-webkit-scrollbar,.queue-list::-webkit-scrollbar{scrollbar-width:none}
.queue-list::-webkit-scrollbar{display:none}
/* 输入框避免 iOS/Android 缩放，并适配深色 */
input[type=search]{font-size:16px}
/* 列表行首尾圆角与卡片贴合 */
#list{border-radius:16px;overflow:hidden}
.row:first-child{border-radius:15px 15px 0 0}
.row:last-child{border-radius:0 0 15px 15px}
/* 播放页顶栏按钮贴合安全区 */
.now-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.now-head button{min-height:40px}
@media(max-width:400px){
  main{padding-left:12px;padding-right:12px}
  .now-page:not(.lyrics-mode) .now-bottom{width:calc(100% - 20px)}
}
/* 横屏/平板：底栏悬浮居中 */
@media(min-width:720px){
  body{padding-bottom:calc(130px + var(--sa-bottom))}
  .player:not(.is-bubble){bottom:calc(12px + var(--sa-bottom))}
  .player.is-bubble{bottom:calc(14px + var(--sa-bottom))}
}


/* 底栏配色统一为深色磨砂，避免浅底白字看不清 */
/* 底栏贴底停靠：不再是悬浮卡片，左右贴边、底边贴屏幕，歌曲不会从下面穿过 */
.player:not(.is-bubble){
  left:0!important; right:0!important; width:100%!important;
  bottom:0!important;
  border-radius:18px 18px 0 0!important;
  background:var(--bg2,#1b1d21)!important;
  border:0!important;
  border-top:1px solid rgba(255,255,255,.08)!important;
  box-shadow:0 -14px 34px rgba(0,0,0,.5)!important;
  padding:12px 16px calc(10px + var(--sa-bottom))!important;
  padding-left:calc(16px + var(--sa-left))!important;
  padding-right:calc(16px + var(--sa-right))!important;
}
.player:not(.is-bubble) .pl-title{color:#eef1f6}
.player:not(.is-bubble) .pl-artist,.player:not(.is-bubble) .times{color:#9aa4b2}
.player:not(.is-bubble) .bar{background:rgba(255,255,255,.16)}
.player:not(.is-bubble) .bar i{background:var(--acc2,#5b9cff)}
.player:not(.is-bubble) .play{background:var(--acc2,#5b9cff);color:#fff}
.player:not(.is-bubble) .pl-cover{background:#2a2e36}
.player.is-bubble{
  background:rgba(26,29,34,.95)!important;
  border:1px solid rgba(255,255,255,.10)!important;
  box-shadow:0 8px 24px rgba(0,0,0,.45)!important;
}
.player.is-bubble .pl-title{color:#eef1f6}
.player.is-bubble .pl-artist{color:#9aa4b2}
.player.is-bubble .play{background:rgba(255,255,255,.14);color:#fff}
.player.is-bubble .pl-cover{background:#2a2e36}

/* 无封面时不显示空白方块 */
.pl-cover:not([src]),.pl-cover[src=""]{opacity:0}
.pl-cover{object-fit:cover}

/* 状态栏遮罩：内容上滑经过状态栏时淡出，避免文字被状态栏图标压住 */
body::before{
  content:'';position:fixed;left:0;right:0;top:0;z-index:31;pointer-events:none;
  height:calc(var(--sa-top) + 10px);
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg) 58%,rgba(0,0,0,0) 100%);
}
/* 播放页顶部沉浸：不再盖实色，让封面模糊色透到状态栏，只加极淡压暗保证图标可读 */
.now-page::before{
  content:'';position:fixed;left:0;right:0;top:0;z-index:2;pointer-events:none;
  height:calc(var(--sa-top) + 26px);
  background:linear-gradient(180deg,rgba(0,0,0,.26) 0%,rgba(0,0,0,.10) 62%,rgba(0,0,0,0) 100%);
  transition:background .35s ease;
}
:root[data-theme="light"] .now-page::before{
  background:linear-gradient(180deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.14) 62%,rgba(255,255,255,0) 100%);
}

/* 歌词文字/进度/指示条跟随封面主色 */
.now-page .lyrics p{color:rgba(232,226,220,.42)}
.now-page .lyrics p.active{color:#fff}
.now-page .lyrics p.active::before{background:var(--hot)!important;box-shadow:0 0 16px rgba(var(--hot-rgb),.9)!important}
.now-page .lyric-word{background:linear-gradient(90deg,#fff var(--word-progress,0%),rgba(214,196,182,.55) var(--word-progress,0%));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.now-page .lyrics p:not(.active) .lyric-word{background:linear-gradient(90deg,rgba(216,206,196,.52) 0%,rgba(150,140,132,.42) 100%);-webkit-background-clip:text;background-clip:text}
.now-page .lyrics-head img{border:1px solid rgba(var(--hot2-rgb),.30);box-shadow:0 6px 18px rgba(var(--hot-rgb),.28)}
.now-page .lyrics-meta i{background:var(--hot2)}
.now-page .lyrics-meta{color:rgba(226,216,206,.62)}
.now-page .track-badges span{background:rgba(var(--hot2-rgb),.14);border-color:rgba(var(--hot2-rgb),.26);color:#f0e4da}

/* ===== 底栏停靠最终覆盖（放在最后，优先级最高） ===== */
.player:not(.is-bubble){
  left:0!important; right:0!important; width:100%!important;
  bottom:0!important;
  margin:0!important;
  border-radius:18px 18px 0 0!important;
  background:var(--bg2,#1b1d21)!important;
  border:0!important;
  border-top:1px solid rgba(255,255,255,.08)!important;
  box-shadow:0 -14px 34px rgba(0,0,0,.5)!important;
  padding:12px 16px calc(10px + var(--sa-bottom))!important;
  padding-left:calc(16px + var(--sa-left))!important;
  padding-right:calc(16px + var(--sa-right))!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
}
:root[data-theme="light"] .player:not(.is-bubble){
    background:#fff!important;
    border-top:1px solid #eceef1!important;
    box-shadow:0 -10px 28px rgba(15,23,42,.10)!important;
  }
/* 内容区与底栏之间留出真实高度，最后一行不会被压住 */
body{padding-bottom:calc(120px + var(--sa-bottom))!important}


/* ===== 底部空间利用：胶囊态少留白，让列表多露 1~2 行 ===== */
body{padding-bottom:calc(112px + var(--sa-bottom))!important}
body.home-chrome-hidden{padding-bottom:calc(96px + var(--sa-bottom))!important}
/* 列表末行只留极窄淡出，不吞掉整行 */
#list{
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 12px),transparent 100%)!important;
  mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 12px),transparent 100%)!important;
}

/* ===== 歌词页沉浸：移除底部控制条，歌词铺满全屏 ===== */
.now-page.lyrics-mode .now-bottom{
  display:none!important;
  opacity:0!important; pointer-events:none!important; height:0!important;
  max-height:0!important; padding:0!important; margin:0!important; border:0!important;
}
.now-page.lyrics-mode .now-pages{margin-bottom:0!important}
.now-page.lyrics-mode .lyrics-panel{padding-bottom:0!important}
/* 歌词区域向下铺到手势条上方，上下各留一点呼吸空间 */
.now-page.lyrics-mode .lyrics{
  inset:96px 0 calc(10px + var(--sa-bottom))!important;
  padding:26vh 26px 22vh!important;
  scroll-padding-block:26vh!important;
  mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 82%,transparent 100%)!important;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 82%,transparent 100%)!important;
}
@media(max-height:740px){
  .now-page.lyrics-mode .lyrics{
    inset:84px 0 calc(8px + var(--sa-bottom))!important;
    padding:18vh 24px 16vh!important;
    scroll-padding-block:18vh!important;
  }
}
/* 歌词页头部更轻，减少干扰 */
.now-page.lyrics-mode .now-head{
  background:linear-gradient(180deg,rgba(0,0,0,.34),rgba(0,0,0,0))!important;
  border-bottom:0!important;
}
/* 沉浸：歌词页隐藏首页底栏的重复信息，只留歌词本身 */
body.page-open .player{opacity:0!important;pointer-events:none!important;transition:opacity .16s ease .30s}
/* 展开时胶囊先留在原位、被封面页盖住，收尾再淡出，形成“从这里展开”的连续感 */
body.page-open .player.is-bubble{opacity:1!important;transition:opacity .14s ease .50s}
/* 收回时胶囊先隐藏，等封面页缩回原位后再淡入 */
body.page-closing .player{opacity:0!important;transition:opacity .12s ease}
body:not(.page-closing):not(.page-open) .player{transition:opacity .26s ease .10s}
/* 关闭时胶囊延迟淡入，和封面页收回的动画接上 */
body:not(.page-open) .player{transition:opacity .26s ease .14s}

/* ===== 封面页底部控制区：去掉方框/底板，融入背景 ===== */
.now-page:not(.lyrics-mode) .now-bottom{
  width:100%!important; max-width:none!important;
  left:0!important; right:0!important; transform:none!important;
  margin:0!important;
  border:0!important;
  border-radius:0!important;
  background:transparent!important;
  box-shadow:none!important;
  backdrop-filter:none!important; -webkit-backdrop-filter:none!important;
  padding:10px 22px calc(12px + var(--sa-bottom))!important;
}
@media(max-width:380px){
  .now-page:not(.lyrics-mode) .now-bottom{padding-left:16px!important;padding-right:16px!important}
}

/* 窄屏压缩：只显示图标式短标签 */

/* ===== 胶囊 ↔ 封面页：浏览器原生 View Transitions（共享元素 morph） ===== */
::view-transition-group(hero-cover){
  animation-duration:.42s;
  animation-timing-function:cubic-bezier(.32,.72,.24,1);
}
::view-transition-old(hero-cover),
::view-transition-new(hero-cover){
  height:100%;width:100%;
  object-fit:cover;
  mix-blend-mode:normal;
  animation-duration:.42s;
  animation-timing-function:cubic-bezier(.32,.72,.24,1);
}
::view-transition-new(hero-cover){z-index:2}
/* 整页做极短交叉淡化：既不硬切、又不会盖住封面 morph */
/* 整页容器展开由 JS 用 Web Animations API 驱动（见 openNow），不走 CSS 关键帧 */
/* 文案最后落地，避免"字先到、唱片后到" */
::view-transition-group(page-root){
  animation-duration:.30s;
  animation-timing-function:cubic-bezier(.32,.72,.24,1);
}
.vt-cover{view-transition-name:hero-cover;contain:layout}
.vt-page{view-transition-name:page-root}
::view-transition-image-pair(hero-cover){isolation:auto}
/* ===== 胶囊 ↔ 封面页：整张唱片从胶囊长出来 ===== */
.now-page{transform-origin:50% 100%}
/* 转场期间：带 backdrop-filter 的层被缩放时每帧都要重算背景采样，是卡顿主因；
   同时给整页 will-change 让它提前上合成层，避免首帧抖动。 */
.now-page.page-anim{will-change:transform,opacity;contain:paint}
.now-page.page-anim .now-head,
.now-page.page-anim .now-bottom,
.now-page.page-anim .queue-sheet,
.now-page.page-anim .lyric-dock{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

.now-page.closing{pointer-events:none}

/* 唱片（含封面）整体从胶囊位置/尺寸长到最终大小 */
.now-page.disc-fly .record-stage{
  animation:disc-fly .52s cubic-bezier(.36,.10,.22,1) both;
  will-change:transform;
}
@keyframes disc-fly{
  from{transform:translate(var(--df-dx,0px),var(--df-dy,0px)) scale(var(--df-s,.18))}
  to{transform:none}
}
/* 页面其它内容稍后淡入，避免抢戏 */
.now-page.disc-fly .now-head,
.now-page.disc-fly .track-info,
.now-page.disc-fly .track-badges,
.now-page.disc-fly .swipe-note,
.now-page.disc-fly .now-bottom,
.now-page.disc-fly .tonearm{
  animation:content-in .30s cubic-bezier(.22,.85,.28,1) both;
  animation-delay:var(--df-delay,.16s);
}
@keyframes content-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.now-page.disc-fly .tonearm{animation:arm-in .34s cubic-bezier(.22,.85,.28,1) both;animation-delay:calc(var(--df-delay,.22s) + .04s)}
@keyframes arm-in{from{opacity:0;transform:translateY(-10px) rotate(-4deg)}to{opacity:1;transform:none}}

/* 收回：唱片缩回胶囊 */
.now-page.closing.disc-fly .record-stage{
  animation:disc-fly .34s cubic-bezier(.55,.06,.68,.19) reverse both;
  z-index:6;
}
.now-page.closing .now-head,
.now-page.closing .track-info,
.now-page.closing .track-badges,
.now-page.closing .swipe-note,
.now-page.closing .now-bottom,
.now-page.closing .tonearm{
  opacity:0!important;transition:opacity .10s ease!important;transition-delay:0s!important;
}

/* 首页后退 */
main,header{transition:none}

/* 胶囊时序 */
body.page-open .player.is-bubble{opacity:1!important;transition:opacity .10s ease .30s}
body.page-open .player.is-bubble.dismissed{opacity:0!important}
body.page-closing .player{opacity:0!important;transition:none}
body:not(.page-open):not(.page-closing) .player{transition:opacity .16s ease .05s}

@media(prefers-reduced-motion:reduce){
  .now-page.on,.now-page.closing{animation:none}
  .now-page.disc-fly .record,.now-page.disc-fly .now-head,
  .now-page.disc-fly .track-info,.now-page.disc-fly .track-badges,
  .now-page.disc-fly .swipe-note,.now-page.disc-fly .now-bottom,
  .now-page.disc-fly .tonearm{animation:none}
  main,header{transition:none}
  body.page-open main,body.page-open header{transform:none;opacity:1}
}

/* ===== 动效增强：音频频谱条（封面下方，随低频跳动） ===== */
.now-art .viz-bars{display:block;width:min(100%,430px);height:44px;margin:-4px auto -6px;flex:none;pointer-events:none;opacity:.22;transition:opacity .5s ease;filter:drop-shadow(0 6px 16px rgba(var(--hot-rgb),.26))}
.now-page.playing .now-art .viz-bars{opacity:1}
:root[data-theme="light"] .now-art .viz-bars{opacity:.34;filter:drop-shadow(0 6px 14px rgba(20,80,180,.18))}
:root[data-theme="light"] .now-page.playing .now-art .viz-bars{opacity:1}
@media(prefers-reduced-motion:reduce){.now-art .viz-bars{display:none}}
@media(max-height:720px){.now-art .viz-bars{height:32px;margin-top:-8px}}

/* ===== 悬浮胶囊（独立元素，纯合成层动画） ===== */
.player.bar-hidden{
  transform:translateY(calc(100% + 24px));
  opacity:0;
  pointer-events:none;
  transition:transform .26s cubic-bezier(.32,.72,.24,1), opacity .18s ease;
  will-change:transform,opacity;
}
.player{transition:transform .26s cubic-bezier(.32,.72,.24,1), opacity .22s ease}
.bubble{
  position:fixed;
  right:14px;
  bottom:calc(14px + var(--sa-bottom));
  z-index:31;
  width:min(232px,calc(100% - 28px));
  height:56px;
  padding:7px 10px;
  box-sizing:border-box;
  display:flex;
  align-items:center;
  gap:9px;
  border-radius:16px;
  border:1px solid rgba(15,23,42,.08);
  background:#fff;
  box-shadow:0 8px 24px rgba(15,23,42,.16),0 1px 3px rgba(15,23,42,.10);
  opacity:0;
  transform:translateY(18px) scale(.92);
  transform-origin:100% 100%;
  pointer-events:none;
  transition:transform .26s cubic-bezier(.32,.72,.24,1), opacity .18s ease;
  will-change:transform,opacity;
  overflow:hidden;
}
.bubble.on{opacity:1;transform:none;pointer-events:auto}
.b-cover{width:38px;height:38px;border-radius:10px;object-fit:cover;background:#eef0f3;flex:0 0 auto}
.b-meta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center}
.b-title{font-size:13.5px;font-weight:600;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.b-sub{font-size:11px;color:#7a8394;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.b-play{width:36px;height:36px;min-width:36px;padding:0;border:0;border-radius:50%;background:#eef2f7;color:#0f172a;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:none}
.b-play:active{transform:scale(.92)}
:root[data-theme="dark"] .bubble{background:#222428;border-color:#3b3d42;box-shadow:0 10px 28px #0008}
:root[data-theme="dark"] .b-title{color:#eef1f6}
:root[data-theme="dark"] .b-sub{color:#9aa4b2}
:root[data-theme="dark"] .b-play{background:rgba(255,255,255,.14);color:#fff}
:root[data-theme="dark"] .b-cover{background:#2a2e36}
@media (prefers-reduced-motion:reduce){.bubble,.player{transition-duration:.01ms!important}}

/* ===== 页面展开的"容器变换"靠一块纯色/渐变薄片完成 =====
   整页节点太多（1300+），直接缩放整页每帧都要重绘文字与模糊层，必卡；
   薄片只有一个 background，缩放走合成器，画面稳定 60~120fps。 */
.page-sheet{
  position:fixed;inset:0;z-index:49;pointer-events:none;
  opacity:0;transform-origin:50% 50%;border-radius:16px;
  will-change:transform,opacity;overflow:hidden;
  background:linear-gradient(160deg,#12100f,#080a10 62%);
}

/* ===== v6.8 底栏改悬浮胶囊（左右离边、四角全圆、整体浮起） ===== */
.player:not(.is-bubble){
  left:12px!important; right:12px!important; width:auto!important;
  bottom:calc(12px + var(--sa-bottom))!important;
  height:calc(92px + var(--sa-bottom))!important;
  border-radius:24px!important;
  background:var(--bg2,#1b1d21)!important;
  border:1px solid rgba(255,255,255,.10)!important;
  box-shadow:0 12px 32px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.16)!important;
  padding:10px 16px 12px!important;
  padding-left:calc(16px + var(--sa-left))!important;
  padding-right:calc(16px + var(--sa-right))!important;
}
:root[data-theme="light"] .player:not(.is-bubble){
  background:#fff!important;
  border:1px solid #e7e9ee!important;
  border-top:1px solid #e7e9ee!important;
  box-shadow:0 12px 30px rgba(15,23,42,.14),0 2px 6px rgba(15,23,42,.06)!important;
}
body{padding-bottom:calc(124px + var(--sa-bottom))!important}
body.home-chrome-hidden{padding-bottom:calc(92px + var(--sa-bottom))!important}

/* ===== v6.8 快速下滑性能：去掉大面积 mask / 顶栏实时模糊，长列表行做渲染隔离 ===== */
#list{
  -webkit-mask-image:none!important;
  mask-image:none!important;
}
header{
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
  background:var(--bg)!important;
}
#list .row{
  contain:layout style paint;
}

/* ===== v6.9 主播放键去掉实心圆底，和两侧按钮同一视觉 ===== */
.now-page:not(.lyrics-mode) .now-controls .main-play,
.now-page.lyrics-mode .now-controls .main-play{
  background:transparent!important;
  background-image:none!important;
  box-shadow:none!important;
  color:#f3e9e2!important;
}
.now-page:not(.lyrics-mode) .now-controls .main-play:active{background:#ffffff12!important;color:#fff!important}
.now-page.lyrics-mode .now-controls .main-play{color:#e8d6cc!important}

/* ===== v6.10 底栏进度条可点按/拖动跳转 ===== */
.player:not(.is-bubble) .bar{
  position:relative;
  overflow:visible;
  touch-action:none;
  cursor:pointer;
}
.player:not(.is-bubble) .bar::before{
  content:"";
  position:absolute;
  left:-6px;right:-6px;top:-12px;bottom:-10px;
}
.player:not(.is-bubble) .bar i{border-radius:2px}
.player:not(.is-bubble) .bar.dragging{height:5px;margin-top:8px;margin-bottom:2px}
.player:not(.is-bubble) .bar.dragging i{box-shadow:0 0 10px rgba(91,156,255,.55)}

/* ===== v3.10 播放/歌词过渡与滚动性能优化 ===== */
/* 页面高度不再随模式切换而变化：底部控制栏改为纯绝对定位浮层，避免滑动结束时整页重排 */
.now-pages{scroll-snap-type:x proximity!important}
.now-page .now-pages{margin-bottom:0!important;transition:none!important}
.now-page:not(.lyrics-mode) .now-art{padding-bottom:calc(158px + var(--sa-bottom))!important}
/* 歌词滚动：交给 JS 的单次 smooth 控制，禁止 CSS 对每次 scrollTo 再叠加一层动画 */
.now-page .lyrics{scroll-behavior:auto!important;contain:paint;will-change:scroll-position;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior-y:contain;user-select:none;-webkit-user-select:none}
.now-page .lyrics p{filter:none!important;transition:color .18s ease,opacity .18s ease,transform .24s ease!important}
.now-page .lyric-word{transition:none!important}
.now-page .lyric-dock{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(14,22,34,.94)!important}
/* 歌词页底部栏：淡出+下移，不再 display:none 瞬间抽走一整块布局 */
.now-page.lyrics-mode .now-bottom{
  display:flex!important;
  opacity:0!important;
  pointer-events:none!important;
  transform:translateY(22px)!important;
  height:64px!important;max-height:none!important;
  padding:4px 28px 8px!important;margin:0!important;border:0!important;
  transition:opacity .18s ease,transform .26s cubic-bezier(.22,.75,.25,1)!important;
}
.now-page:not(.lyrics-mode) .now-bottom{
  opacity:1!important;transform:none!important;
  transition:opacity .22s ease .05s,transform .3s cubic-bezier(.22,.75,.25,1)!important;
}

function fmt(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;

// 多镜像 + 超时
async function api(params, timeout = 12000, options = {}){
  let lastErr;
  for (const host of options.host ? [options.host] : HOSTS){
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), timeout);
    try{
      const r = await fetch(host + '?' + params, {signal: ctl.signal, cache:'no-store'});
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      if (!Array.isArray(data)) throw new Error('接口返回格式错误');
      if (!data.length && !options.allowEmpty) throw new Error('empty');
      return {data, host};
    }catch(e){ lastErr = e; clearTimeout(timer); }
  }
  throw lastErr || new Error('network');
}

function parsePlaylist(input,source){
  input=input.trim();
  if(/^\d+$/.test(input)) return {server:source,id:input};
  const found=input.match(/https?:\/\/[^\s<>"'，。]+/i);
  if(!found) throw new Error('请粘贴完整歌单链接或数字 ID');
  const u=new URL(found[0]); let server,id;
  if(/(^|\.)music\.163\.com$/.test(u.hostname)||u.hostname==='163cn.tv'){
    server='netease'; id=u.searchParams.get('id')||(u.hash.match(/[?&]id=(\d+)/)||[])[1]||(u.pathname.match(/\/playlist\/(\d+)/)||[])[1];
  } else if(/(^|\.)y\.qq\.com$/.test(u.hostname)){
    server='tencent'; id=u.searchParams.get('id')||u.searchParams.get('disstid')||(u.pathname.match(/\/(?:playlist|taoge)\/(\d+)/)||[])[1];
  } else throw new Error('仅支持网易云或 QQ 音乐歌单链接');
  if(!/^\d+$/.test(id||'')) throw new Error('该分享短链没有歌单 ID，请在原平台打开后复制完整歌单链接，或输入歌单数字 ID');
  return {server,id};
}

async function readFullPlaylist(ref,onProgress,isCurrent){
  if(location.protocol==='file:')throw new Error('请通过本机服务打开 http://127.0.0.1:18766/ ，文件预览无法调用完整歌单接口');
  const items=[],seen=new Set();let offset=0,total=null,title=ref.id;
  while(isCurrent()){
    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),45000);
    let page;
    try{
      const r=await fetch('/.netlify/functions/playlist?'+new URLSearchParams({server:ref.server,id:ref.id,offset:String(offset)}),{signal:ctl.signal,cache:'no-store'});
      if(r.status===404)throw new Error('完整歌单服务尚未部署，需同时部署 Netlify Functions；单独上传 HTML 无法启用');
      if(!(r.headers.get('content-type')||'').includes('application/json'))throw new Error('完整歌单服务未启用，请部署包含 Functions 的站点');
      page=await r.json();if(!r.ok)throw new Error(page.error||'读取歌单失败');
    }finally{clearTimeout(timer);}
    if(!isCurrent())return null;
    if(!Number.isSafeInteger(page.total)||page.total<0||!Array.isArray(page.items)||!Number.isSafeInteger(page.nextOffset))throw new Error('歌单服务返回无效分页数据');
    if(total!==null&&total!==page.total)throw new Error('歌单在导入期间发生变化，请重新导入');
    total=page.total;title=page.title||title;
    // Keep every playlist position, including duplicate tracks. Detect a backend that ignores offset.
    const signature=JSON.stringify(page.items.map(it=>it.id||it.url));
    if(page.items.length&&seen.has(signature))throw new Error('平台重复返回同一页，已保留 '+items.length+'/'+total+' 首，请稍后重试');
    seen.add(signature);
    if(page.nextOffset!==offset+page.items.length||page.nextOffset>total)throw new Error('分页位置与曲目数量不一致');
    items.push(...page.items);onProgress(items,total,title);
    if(page.complete){if(items.length!==total)throw new Error('平台未返回完整歌单');return {items,total,title};}
    if(page.nextOffset<=offset)throw new Error('平台未返回后续曲目，已读取 '+items.length+'/'+total+' 首');
    offset=page.nextOffset;
  }
  return null;
}
async function importPlaylist(ref){

      loaded=items;expected=total;el('hint').textContent=title+' · 正在导入 '+items.length+'/'+total+' 首…';
    },()=>request===viewRequest);

  }
}

async function runBatch(items,quality){
  if(batchRunning)return;batchRunning=true;batchCancelled=false;
  el('batchStop').hidden=false;updateSelection();
  let ok=0,failed=0,fallback=0;const failures=[];
  for(const item of items){
    if(batchCancelled)break;
    el('batchStatus').textContent=`正在处理 ${ok+failed+1}/${items.length}：${item.name}\n浏览器如提示，请允许此网站下载多个文件。`;
    batchController=new AbortController();
    const result=await doDownload(item,null,quality,batchController.signal);
    if(result.cancelled)break;
    if(result.ok){ok++;if(result.fallback)fallback++;}else{failed++;failures.push(item.name||'未知曲目');}
  }
  batchController=null;batchRunning=false;el('batchStop').hidden=true;updateSelection();
  el('batchStatus').textContent=`${batchCancelled?'已停止':'处理完成'}：已发起保存 ${ok} 首，失败 ${failed} 首，未处理 ${items.length-ok-failed} 首${fallback?'，其中 '+fallback+' 首未返回 FLAC':''}。请在浏览器下载列表确认保存结果。`+(failures.length?'\n失败：'+failures.join('、'):'');
}

      <button class="icon download" type="button" title="按歌名和歌手下载">⬇</button>

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(items, prefix, append=false){
  const start=append?list.length:0;
  list = items;
  cur = typeof playingItem !== 'undefined' ? items.indexOf(playingItem) : -1;
  if(!append){selectedSongs.clear(); updateSelection();}
  el('batchTools').classList.toggle('on',playlistView);
  const box = el('list');
  if (!items.length){ box.innerHTML = '<div class="empty">没有结果</div>'; return; }
  if(append)box.insertAdjacentHTML('beforeend',items.slice(start).map((it,i)=>card(it,i+start,prefix)).join(''));
  else {
    /* 整表替换交给 auto-animate（FLIP 计算每个 row 的位置差），不再用整块 list-swap 动画 */
    box.innerHTML = items.map((it,i)=>card(it,i,prefix)).join('');
  }
  box.querySelectorAll('.row').forEach(row=>{
    if(append&&Number(row.dataset.i)<start)return;
    row.onclick = e=>{
      if (e.target.closest('.song-select')) {
        const i=Number(row.dataset.i);
        if(e.target.checked) selectedSongs.add(i); else selectedSongs.delete(i);
        updateSelection(); return;

      const index=Number(row.dataset.i);

      if(e.target.closest('.remove-song'))return removePersonalTrack(index);
      if (e.target.closest('.download')) {

        return;
      }
      play(Number(row.dataset.i));
    };
  });
  if (cur >= 0) markPlaying();
}

function audioFormat(bytes){
  const s = String.fromCharCode(...bytes.slice(0,12));
  if (s.startsWith('fLaC')) return ['flac','audio/flac'];
  if (s.startsWith('OggS')) return ['ogg','audio/ogg'];
  if (s.startsWith('RIFF') && s.slice(8,12)==='WAVE') return ['wav','audio/wav'];
  if (s.startsWith('ID3') || (bytes[0]===255 && (bytes[1]&224)===224)) return ['mp3','audio/mpeg'];
  if (s.slice(4,8)==='ftyp') return ['m4a','audio/mp4'];
  if (bytes[0]===26 && bytes[1]===69 && bytes[2]===223 && bytes[3]===163) return ['webm','audio/webm'];
  throw new Error('服务器没有返回可识别的音频');
}
function songFilename(item, ext){
  const clean = s => String(s).replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').trim().slice(0,90);
  return clean(item.name||'未知曲目') + ' - ' + clean(item.artist||'未知歌手') + '.' + ext;
}

  el('sheet').classList.add('on');

// 按音质改写接口地址：无损加 br=999000，标准去掉 br
function withQuality(url, quality){
  try{
    const u = new URL(url, location.href);
    if (quality === 'flac') u.searchParams.set('br','999000');
    else u.searchParams.delete('br');
    return u.toString();
  }catch(e){
    if (quality !== 'flac') return url;
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'br=999000';
  }
}
async function doDownload(item, button, quality, signal){
  if (!item) return {ok:false};
  const ctl = new AbortController();
  const cancel=()=>ctl.abort();
  if(signal){signal.addEventListener('abort',cancel,{once:true});if(signal.aborted)ctl.abort();}
  const timer = setTimeout(()=>ctl.abort(),300000);
  const oldLabel = button ? button.textContent : '⬇';
  if (button){ button.disabled = true; button.textContent = '…'; }
  toast(quality === 'flac' ? '正在获取无损音频，文件较大请稍候…' : '正在准备音频，完成后按歌名保存');
  try {
    let downloadUrl=withQuality(item.url,quality);
    if(['netease','tencent','kugou','kuwo'].includes(playbackPlatform(item))){const result=await resolvePlayback(item,ctl.signal);downloadUrl=result.url;}
    const r = await fetch(downloadUrl, {signal: ctl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.arrayBuffer();
    if (!data.byteLength) throw new Error('接口返回空文件，可能该曲暂无此音质');
    const [ext, mime] = audioFormat(new Uint8Array(data));
    const filename = songFilename(item, ext);
    const url = URL.createObjectURL(new Blob([data], {type: mime}));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 180000);
    const mb = (data.byteLength / 1048576).toFixed(1);
    if (quality === 'flac' && ext !== 'flac') toast('该曲暂无无损，已保存 ' + ext.toUpperCase() + '（' + mb + ' MB）');
    else toast('已下载：' + filename + '（' + mb + ' MB）');
    return {ok:true,fallback:quality==='flac'&&ext!=='flac'};
  } catch(e) {
    if(signal?.aborted)return {ok:false,cancelled:true};
    toast('下载失败：' + (e.name === 'AbortError' ? '请求超时，请重试' : e.message));
    return {ok:false};
  } finally {
    if(signal)signal.removeEventListener('abort',cancel);
    clearTimeout(timer);
    if (button){ button.disabled = false; button.textContent = oldLabel; }
  }
}

function parseLrc(text){
  const offsetMatch = text.match(/\[offset:([+-]?\d+)\]/i);
  const offset = offsetMatch ? Number(offsetMatch[1])/1000 : 0;
  const lines = [];
  for (const raw of text.split(/\r?\n/)){
    const tags = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
    const body = raw.replace(/\[[^\]]*\]/g,'').trim();
    if (!body || !tags.length) continue;
    const wordTags = [...body.matchAll(/<(\d+):(\d+(?:\.\d+)?)>/g)];
    let words = [];
    let cursor = 0;
    let wordTime = null;
    for (const tag of wordTags){
      const before = body.slice(cursor,tag.index);
      if (before) words.push({time:wordTime,text:before});
      wordTime = Math.max(0,Number(tag[1])*60+Number(tag[2])+offset);
      cursor = tag.index+tag[0].length;
    }
    const tail = body.slice(cursor);
    if (tail) words.push({time:wordTime,text:tail});
    const cleanText = words.map(word=>word.text).join('').trim();
    if (!cleanText) continue;
    for (const tag of tags){
      const time = Math.max(0,Number(tag[1])*60+Number(tag[2])+offset);
      const lineWords = words.map(word=>({time:word.time===null?time:word.time,text:word.text}));
      lines.push({time,text:cleanText,words:lineWords,wordTimed:wordTags.length>0});
    }
  }
  return lines.sort((a,b)=>a.time-b.time);
}

function syncLyrics(force=false){
  const page=el('nowPage');
  if(!page.classList.contains('lyrics-mode')) return;
  const time=Number.isFinite(audio.currentTime)?audio.currentTime:0;
  let index = -1;
  for (let i=0;i<lyricLines.length && lyricLines[i].time<=time;i++) index=i;
  const changed = index!==lyricIndex;
  const rows = el('lyrics').children;
  if (changed){
    if (rows[lyricIndex]) rows[lyricIndex].classList.remove('active');
    if (rows[index]) rows[index].classList.add('active');
    lyricIndex=index;
  }
  if(index>=0){
    const line=lyricLines[index], next=lyricLines[index+1];
    const fallbackEnd=line.time+3.2;
    const lineEnd=next?Math.max(line.time+.12,next.time):Math.max(line.time+.12,Math.min(audio.duration||fallbackEnd,fallbackEnd));
    const lineProgress=Math.max(0,Math.min(1,(time-line.time)/Math.max(.12,lineEnd-line.time)));
    const words=rows[index]?.querySelectorAll('.lyric-word')||[];
    if(line.wordTimed){
      let currentWord=-1;
      words.forEach((node,j)=>{
        const word=line.words[j], following=line.words[j+1];
        const start=word?.time??line.time;
        const end=following?.time??lineEnd;
        const progress=Math.max(0,Math.min(1,(time-start)/Math.max(.08,end-start)));
        const pct=(progress*100).toFixed(0);
        if(node.dataset.wp!==pct){ node.dataset.wp=pct; node.style.setProperty('--word-progress',pct+'%'); }
        if(time>=start&&time<end) currentWord=j;
      });
      if(line._word!==currentWord){ words.forEach((node,j)=>node.classList.toggle('word-current',j===currentWord)); line._word=currentWord; }
    }else if(words[0]){
      const pct=(lineProgress*100).toFixed(1);
      if(words[0].dataset.wp!==pct){ words[0].dataset.wp=pct; words[0].style.setProperty('--word-progress',pct+'%'); }
    }
    const dockText=line.text.length>30?line.text.slice(0,30)+'…':line.text;
    if(el('lyricDockText').textContent!==dockText) el('lyricDockText').textContent=dockText;
    const statusText=line.wordTimed?'逐字同步':'跟随播放';
    if(el('lyricStatus').textContent!==statusText) el('lyricStatus').textContent=statusText;
  }else if(lyricLines.length){
    if(el('lyricDockText').textContent!=='即将开始') el('lyricDockText').textContent='即将开始';
    if(el('lyricStatus').textContent!=='等待歌词') el('lyricStatus').textContent='等待歌词';
  }
  if ((changed || force) && index>=0 && Date.now()>lyricTouchUntil && page.classList.contains('on') && el('nowPages').scrollLeft>el('nowPages').clientWidth/2){
    const row=rows[index];
    if(row){
      const target=row.offsetTop-el('lyrics').clientHeight*.43+row.clientHeight/2;
      const max=Math.max(0,el('lyrics').scrollHeight-el('lyrics').clientHeight);
      el('lyrics').scrollTo({top:Math.max(0,Math.min(max,target)),behavior:force?'auto':'smooth'});
    }
  }
}

async function probePlaybackUrl(url,signal){
  const ctl=new AbortController(),abort=()=>ctl.abort();
  signal.addEventListener('abort',abort,{once:true});if(signal.aborted)ctl.abort();
  const timer=setTimeout(abort,6500);let reader;
  try{
    const r=await fetch(url,{signal:ctl.signal,cache:'no-store',headers:{Range:'bytes=0-4095'}});
    if(!r.ok)throw Error('HTTP '+r.status);
    reader=r.body?.getReader();let chunks=[],length=0;
    if(reader){while(length<16384){const {value,done}=await reader.read();if(done)break;chunks.push(value.slice(0,16384-length));length+=chunks[chunks.length-1].length;
      if((r.headers.get('content-type')||'').startsWith('audio/')||length>=16384)break;}}
    else {const b=new Uint8Array(await r.arrayBuffer());chunks=[b.slice(0,16384)];length=chunks[0].length;}
    const bytes=new Uint8Array(length);let offset=0;for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.length;}
    if(!length)throw Error('音源返回空内容');
    try{audioFormat(bytes);return r.url||url;}catch{}
    if((r.headers.get('content-type')||'').startsWith('audio/'))return r.url||url;
    let data;try{data=JSON.parse(new TextDecoder().decode(bytes));}catch{throw Error('音源没有返回音频');}
    const candidate=typeof data==='string'?data:data?.url||data?.data?.url||data?.[0]?.url;
    const resolved=webUrl(candidate);
    if(!resolved||resolved===url)throw Error('音源没有提供播放地址');
    return resolved;
  }finally{clearTimeout(timer);signal.removeEventListener('abort',abort);if(reader)try{await reader.cancel();}catch{}}
}

  const data=await r.json();
  if(!r.ok)throw Error(data.error||'完整音频核验失败');
  if(!data.verifiedFull||!data.fullDecoded||!data.tailDecoded||!Number.isFinite(data.duration)||!/^\/media\/[a-f0-9]{36}$/.test(data.url))throw Error('音源未通过完整性核验');

  try{

    document.title = artist ? (title + ' · ' + artist) : title;

function rgbToHsl(r, g, b) {

<script>
/* ===== 音乐雷达 · 动效增强：Anime.js 交错入场 + 原生音频频谱 ===== */
(function () {
  'use strict';
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  /* ---------- 1) auto-animate：所有动态列表的元素增删/切换动画 ----------
     @formkit/auto-animate 用 FLIP 自动计算前后位置差，只作用于"子元素增删"，
     不干扰我们自己的页面级容器变换（openNow/closeNowSilent 里的 WAAPI）。 */
  var aaTargets = [];
  (function autoAnimateInit() {
    if (reduce || !window.autoAnimate) return;
    var ids = ['list', 'libraryLists', 'queueList', 'savedLists', 'tabs', 'lyrics', 'batchTools'];
    for (var i = 0; i < ids.length; i++) {
      var node = document.getElementById(ids[i]);
      if (!node) continue;
      try {
        window.autoAnimate(node, {
          duration: 240,
          easing: 'ease-out',
          disrespectUserMotionPreference: false
        });
        aaTargets.push(ids[i]);
      } catch (e) {}
    }
    window.__aaTargets = aaTargets;
  })();

  /* ---------- 2) 音频频谱可视化（封面下方，随低频跳动） ---------- */
  (function vizInit() {
    if (reduce) return;
    var canvas = document.getElementById('vizBars');
    var audioEl = document.getElementById('audio');
    var page = document.getElementById('nowPage');
    if (!canvas || !audioEl || !page) return;
    var cctx = canvas.getContext('2d');
    if (!cctx) return;

    var BARS = 56;
    var cur = new Float32Array(BARS);
    var actx = null, analyser = null, srcNode = null, freq = null;
    var connected = false, failed = false;
    var raf = 0, running = false, phase = 0;

    function sizeCanvas() {
      var rect = canvas.getBoundingClientRect();
      var w = Math.max(1, rect.width), h = Math.max(1, rect.height);
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var W = Math.round(w * dpr), H = Math.round(h * dpr);
      if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
      cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { w: w, h: h };
    }

    function ensureAudio() {
      if (connected || failed) return;
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { failed = true; return; }
        if (!actx) {
          actx = new AC();
          analyser = actx.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.82;
          freq = new Uint8Array(analyser.frequencyBinCount);
        }
        if (actx.state === 'suspended') { actx.resume().catch(function () {}); }
        /* 关键：AudioContext 没 running 就接入音源会把声音吞掉，必须等 running */
        if (actx.state !== 'running') return;
        if (!srcNode) {
          srcNode = actx.createMediaElementSource(audioEl);
          srcNode.connect(analyser);
          analyser.connect(actx.destination);
        }
        connected = true;
      } catch (e) { failed = true; }
    }

    function levels() {
      var out = new Float32Array(BARS);
      var playing = !audioEl.paused && !audioEl.ended && audioEl.readyState >= 2;
      var real = false, maxv = 0, i;
      if (connected && analyser) {
        analyser.getByteFrequencyData(freq);
        for (i = 0; i < freq.length; i++) { if (freq[i] > maxv) maxv = freq[i]; }
        if (maxv > 6) real = true;
      }
      if (real) {
        var span = Math.max(8, Math.floor(freq.length * 0.62));
        var mid = (BARS - 1) / 2;
        for (i = 0; i < BARS; i++) {
          var dist = Math.abs(i - mid) / mid;            /* 0 中心 .. 1 边缘 */
          var idx = Math.floor(dist * (span - 1));       /* 低频在中心，高频在两侧 */
          var v = freq[idx] / 255;
          out[i] = Math.pow(v, 1.15);
        }
        /* 低频整体抬一点，视觉更“打点” */
        var boost = Math.min(1, (freq[1] + freq[2] + freq[3]) / (3 * 255));
        for (i = 0; i < BARS; i++) {
          var d2 = Math.abs(i - mid) / mid;
          out[i] = Math.min(1, out[i] * (1 + boost * (1 - d2) * 0.8));
        }
      } else if (playing) {
        /* 分析不可用（CORS 静音）时用合成律动保活 */
        var mid2 = (BARS - 1) / 2;
        for (i = 0; i < BARS; i++) {
          var dd = Math.abs(i - mid2) / mid2;
          var a = phase * 1.6 + dd * 7.0;
          var v2 = 0.5 + 0.5 * Math.sin(a) * (0.55 + 0.45 * Math.sin(phase * 0.9 + dd * 3.1));
          out[i] = Math.max(0, Math.pow(v2, 1.7)) * (0.85 - dd * 0.35);
        }
      }
      return out;
    }

    function roundRect(x, y, w, h, r) {
      if (h < 2 * r) r = h / 2;
      cctx.beginPath();
      cctx.moveTo(x + r, y);
      cctx.arcTo(x + w, y, x + w, y + h, r);
      cctx.arcTo(x + w, y + h, x, y + h, r);
      cctx.arcTo(x, y + h, x, y, r);
      cctx.arcTo(x, y, x + w, y, r);
      cctx.closePath();
    }

    function draw() {
      var d = sizeCanvas();
      var w = d.w, h = d.h;
      cctx.clearRect(0, 0, w, h);
      var lv = levels();
      phase += 0.06;
      var gap = 2;
      var bw = Math.max(2, (w - (BARS - 1) * gap) / BARS);
      var baseY = h - 1.5;
      for (var i = 0; i < BARS; i++) {
        cur[i] += (lv[i] - cur[i]) * 0.32;
        var bh = Math.max(1.5, cur[i] * (h - 3));
        var x = i * (bw + gap);
        var v = Math.min(1, cur[i]);
        var light = document.documentElement.dataset.theme === 'light';
        /* 浅色底要更深的柱色 + 更高不透明度，否则侧边低频柱几乎看不见 */
        var r = light ? Math.round(38 + (14 - 38) * v)  : Math.round(91 + (56 - 91) * v);
        var g = light ? Math.round(102 + (168 - 102) * v) : Math.round(140 + (217 - 140) * v);
        var b = light ? Math.round(214 + (150 - 214) * v) : Math.round(255 + (169 - 255) * v);
        var alpha = light ? (0.72 + 0.28 * v) : (0.45 + 0.55 * v);
        cctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
        roundRect(x, baseY - bh, bw, bh, Math.min(bw / 2, 3));
        cctx.fill();
      }
      if (running) raf = requestAnimationFrame(draw);
    }

    function start() {
      if (running) return;
      running = true;
      sizeCanvas();
      raf = requestAnimationFrame(draw);
    }
    function stop() {
      running = false;
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
    }

    function unlock() {
      ensureAudio();
      if (actx && actx.state === 'suspended') { actx.resume().catch(function () {}); }
    }
    document.addEventListener('pointerdown', unlock, { passive: true });
    audioEl.addEventListener('play', function () {
      unlock();
      if (page.classList.contains('on')) start();
    });

    /* 打开/关闭播放页时启停 rAF，省电 */
    var obs = new MutationObserver(function () {
      if (page.classList.contains('on')) start(); else stop();
    });
    obs.observe(page, { attributes: true, attributeFilter: ['class'] });
    window.addEventListener('resize', function () { if (running) sizeCanvas(); }, { passive: true });

    if (page.classList.contains('on')) start();
  })();
})();
