name: MusicRadar
options:
  bundleIdPrefix: com.musicradar
  deploymentTarget:
    iOS: "13.0"
packages:
  MusicRadarCore:
    path: ../MusicRadarCore
targets:
  MusicRadar:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: MusicRadarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musicradar.app
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: MusicRadar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
