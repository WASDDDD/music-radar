name: MusicRadar
options:
  bundleIdPrefix: com.musicradar
  deploymentTarget:
    iOS: "16.2"
packages:
  MusicRadarCore:
    path: ../MusicRadarCore
targets:
  MusicRadar:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
        buildPhase: resources
      - path: Assets.xcassets
    dependencies:
      - package: MusicRadarCore
      - target: MusicRadarWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musicradar.app
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: MusicRadar
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
  MusicRadarWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musicradar.app.widget
        INFOPLIST_FILE: WidgetInfo.plist
        PRODUCT_NAME: MusicRadarWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
